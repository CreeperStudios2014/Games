<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lemon Clicker — Money Edition</title>
<style>
:root{--accent:#f6b93b;--bg:#081218;--muted:#e6eef6;--surface:rgba(255,255,255,.07)}*{box-sizing:border-box;font-family:system-ui,sans-serif}body{margin:0;background:var(--bg);color:var(--muted)}#game{max-width:1000px;margin:auto;padding:18px}header,.screen-header,.stat,.shop-row,.upgrade-row,.money-banner{display:flex;align-items:center;justify-content:space-between;gap:12px}header{margin-bottom:20px}button{border:0;border-radius:8px;padding:9px 12px;background:var(--accent);font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.layout{display:grid;grid-template-columns:220px 1fr 220px;gap:18px}.panel,.shop-row,.upgrade-row,.building-option,.money-banner{background:var(--surface);border-radius:10px;padding:12px}.panel h3{margin-top:0}.stat{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08)}#lemon-card{height:280px;display:grid;place-items:center;background:var(--surface);border-radius:14px;position:relative;overflow:hidden}#lemonImg{position:absolute;width:100%;height:100%;object-fit:cover;opacity:.18}#lemonOverlay{z-index:1;text-align:center}.clicker{font-size:42px;border-radius:50%;padding:22px;background:rgba(255,255,255,.16)}#perClick{margin-top:8px}.shop{display:grid;gap:8px;margin-top:16px}.small{font-size:12px;opacity:.75}.screen{display:none;position:fixed;inset:0;z-index:10;overflow:auto;background:var(--bg);padding:28px}.screen.open{display:block}.screen-content{max-width:900px;margin:18px auto}.upgrade-grid,.building-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px;margin-bottom:20px}.upgrade-row{align-items:stretch}.description{flex:1}.owned{color:#8ee38e;font-weight:700;margin-top:5px}.money-banner{font-size:18px;margin-bottom:18px}@media(max-width:800px){.layout{grid-template-columns:1fr}.panel{width:auto}}
</style>
</head>
<body>
<div id="game"><header><h1>🍋 Lemon Clicker</h1><button id="upgradesBtn">Upgrades</button></header>
<div class="layout"><aside class="panel"><h3>Building Timers</h3><div id="timersList"></div></aside><main><div id="lemon-card"><img id="lemonImg" alt="Lemon"><div id="lemonOverlay"><button class="clicker" id="clicker">🍋</button><div id="perClick">+$1</div><div class="small">Click to earn money.</div></div></div><div class="shop" id="shop"></div></main><aside class="panel"><div class="stat"><span>Money</span><strong id="money">$0</strong></div><div class="stat"><span>Money / sec</span><strong id="mps">0/s</strong></div></aside></div></div>
<div id="upgradesScreen" class="screen"><div class="screen-header"><h2>Upgrades</h2><button id="closeUpgrades">Close</button></div><div class="screen-content"><div class="money-banner"><span>Current money</span><strong id="upgradeMoney">$0</strong></div><h3>Global upgrades</h3><div id="globalUpgradeGrid" class="upgrade-grid"></div><h3>Managers</h3><div id="managerGrid" class="upgrade-grid"></div><h3>Building upgrades</h3><div id="buildingGrid" class="building-grid"></div></div></div>
<div id="buildingScreen" class="screen"><div class="screen-header"><h2 id="buildingScreenTitle">Building Upgrades</h2><button id="closeBuildingScreen">Back</button></div><div class="screen-content"><div class="money-banner"><span>Current money</span><strong id="buildingMoney">$0</strong></div><div id="buildingUpgradeGrid" class="upgrade-grid"></div></div></div>
<script>
(()=>{
const E=id=>document.getElementById(id),KEY='lemon_money_v3';
const buildings=[['stand','Lemon Stand',10,5,1],['dash','Lemon Dash',40,4,4],['depot','Lemon Depot',160,12,16]];
const globals=[['click_power','Click Power',50,'Click power +1'],['click_speed','Click Speed',100,'Click cooldown -50ms']];
const buildingUpgrades={stand:[['stand_power','Power +2',100],['stand_time','Interval -1s',150]],dash:[['dash_power','Power +4',300]],depot:[['depot_power','Power +10',800]]};
let s={money:0,perClick:1,cooldown:250,lastClick:0,owned:{stand:true},progress:{stand:0},managers:{},upgrades:{},lastTick:Date.now()};
function load(){try{Object.assign(s,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){} buildings.forEach(b=>{s.owned[b[0]]??=false;s.progress[b[0]]??=0;s.managers[b[0]]??=false});s.owned.stand=true}
function save(){localStorage.setItem(KEY,JSON.stringify(s))}function fmt(n){return '$'+Math.floor(n).toLocaleString()}
function buy(cost,action){if(s.money<cost)return false;s.money-=cost;action();save();render();return true}
function row(container,name,desc,cost,id,action,kind='upgrade'){let owned=kind==='manager'?s.managers[id]:s.upgrades[id],r=document.createElement('div');r.className='upgrade-row';r.innerHTML='<div class="description"><b>'+name+'</b><div class="small">'+desc+'</div>'+(owned?'<div class="owned">Owned</div>':'')+'</div>';let b=document.createElement('button');b.textContent=owned?'Owned':fmt(cost);b.disabled=owned;b.onclick=()=>buy(cost,()=>{action();});r.appendChild(b);container.appendChild(r)}
function renderUpgrades(){E('upgradeMoney').textContent=fmt(s.money);let g=E('globalUpgradeGrid');g.innerHTML='';globals.forEach(u=>row(g,u[1],u[3],u[2],u[0],()=>{s.upgrades[u[0]]=true;if(u[0]==='click_power')s.perClick++;else s.cooldown=Math.max(50,s.cooldown-50)}));let m=E('managerGrid');m.innerHTML='';buildings.forEach(b=>row(m,b[1]+' Manager','Automates '+b[1],b[2]*5,b[0],()=>s.managers[b[0]]=true,'manager'));let bg=E('buildingGrid');bg.innerHTML='';buildings.forEach(b=>{let x=document.createElement('div');x.className='building-option';x.innerHTML='<b>'+b[1]+'</b><div class="small">View '+(buildingUpgrades[b[0]]||[]).length+' upgrades</div>';let btn=document.createElement('button');btn.textContent='Open';btn.onclick=()=>{renderBuilding(b[0]);E('upgradesScreen').classList.remove('open');E('buildingScreen').classList.add('open')};x.append(btn);bg.append(x)})}
function renderBuilding(id){let b=buildings.find(x=>x[0]===id);E('buildingScreenTitle').textContent=b[1]+' Upgrades';E('buildingMoney').textContent=fmt(s.money);let g=E('buildingUpgradeGrid');g.innerHTML='';(buildingUpgrades[id]||[]).forEach(u=>row(g,u[1],u[1],u[2],u[0],()=>{s.upgrades[u[0]]=true;if(u[1].includes('Power'))b[2]+=Number(u[1].match(/\d+/)[0]);else b[4]=Math.max(.25,b[4]-1)}))}
function renderShop(){let c=E('shop');c.innerHTML='';buildings.forEach(b=>{let r=document.createElement('div');r.className='shop-row';r.innerHTML='<span><b>'+b[1]+'</b><div class="small">'+(s.owned[b[0]]?'Owned':'Produces '+b[2]+'/cycle every '+b[4]+'s')+'</div></span>';let q=document.createElement('button');q.textContent=s.owned[b[0]]?'Owned':fmt(b[2]);q.disabled=s.owned[b[0]];q.onclick=()=>buy(b[2],()=>{s.owned[b[0]]=true;s.progress[b[0]]=0});r.append(q);c.append(r)})}
function collect(id){let b=buildings.find(x=>x[0]===id);if(!b||!s.owned[id]||s.managers[id])return;let cycles=Math.floor((s.progress[id]||0)/b[4]);if(cycles<1)return;s.money+=cycles*b[2];s.progress[id]%=b[4];save();render()}
function render(){E('money').textContent=fmt(s.money);E('perClick').textContent='+$'+s.perClick;E('mps').textContent=Math.floor(buildings.reduce((n,b)=>n+(s.owned[b[0]]&&s.managers[b[0]]?b[2]/b[4]:0),0))+'/s';renderShop();renderUpgrades();let t=E('timersList');t.innerHTML='';buildings.forEach(b=>{if(!s.owned[b[0]])return;let p=s.progress[b[0]]||0;t.innerHTML+='<div class="small"><b>'+b[1]+'</b><br>'+(s.managers[b[0]]?'Automated':'Progress: '+p.toFixed(1)+'/'+b[4]+'s')+(s.managers[b[0]]?'':'<br><button data-id="'+b[0]+'">Collect</button>')+'</div>'});t.querySelectorAll('button').forEach(x=>x.onclick=()=>collect(x.dataset.id))}
function tick(){let now=Date.now(),dt=(now-s.lastTick)/1000;s.lastTick=now;buildings.forEach(b=>{if(!s.owned[b[0]])return;s.progress[b[0]]=(s.progress[b[0]]||0)+dt;if(s.managers[b[0]]){let q=Math.floor(s.progress[b[0]]/b[4]);if(q){s.money+=q*b[2];s.progress[b[0]]%=b[4]}}});render()}
load();E('clicker').onclick=()=>{let n=Date.now();if(n-s.lastClick>=s.cooldown){s.lastClick=n;s.money+=s.perClick;save();render()}};E('upgradesBtn').onclick=()=>{renderUpgrades();E('upgradesScreen').classList.add('open')};E('closeUpgrades').onclick=()=>E('upgradesScreen').classList.remove('open');E('closeBuildingScreen').onclick=()=>{E('buildingScreen').classList.remove('open');E('upgradesScreen').classList.add('open')};E('lemonImg').src='https://source.unsplash.com/1600x900/?lemon';render();setInterval(tick,250)
})();
</script></body></html>
