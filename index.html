<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lemon Clicker — Money Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--accent:#f6b93b;--bg:#081218;--muted:rgba(230,238,246,.9);--surface:rgba(255,255,255,.05)}
*{box-sizing:border-box;font-family:Inter,system-ui,sans-serif}body{margin:0;background:var(--bg);color:var(--muted)}#game{max-width:1100px;margin:auto;padding:18px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1{font-size:20px;margin:0}.controls button,.buyBtn,.collectBtn{border:0;border-radius:8px;padding:8px 10px;background:var(--accent);color:#081218;font-weight:700;cursor:pointer}.controls button{margin-left:8px}.controls #muteBtn{background:var(--surface);color:var(--muted)}
main{display:flex;gap:18px;align-items:flex-start}#timers-panel{width:220px}#play-area{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}#sidebar{width:260px}.stat{display:flex;justify-content:space-between;padding:6px 0}.panel{background:var(--surface);padding:14px;border-radius:10px;margin-top:12px}
#lemon-card{width:min(100%,480px);height:260px;background:var(--surface);border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative}#lemonImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:12px;opacity:.08}#lemonOverlay{position:relative;text-align:center;z-index:1}#clicker{font-size:40px;padding:18px;border:0;border-radius:999px;background:rgba(255,255,255,.06);color:var(--muted);cursor:pointer}#perClick{margin-top:8px;font-weight:700}.small{font-size:12px;color:rgba(230,238,246,.72)}
#upgradesContainer,#buildingUpgradeGrid{width:min(100%,480px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px}.upgrade-section{grid-column:1/-1;font-size:14px;font-weight:700;margin-top:8px}.upgrade-row,.building-option{display:flex;flex-direction:column;align-items:stretch;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--surface);border-radius:8px;min-width:0}.upgrade-row .description{flex:1}.upgrade-row .buyBtn,.building-option .buyBtn{width:100%;white-space:nowrap}.building-option{cursor:pointer}.building-option:hover{background:rgba(255,255,255,.1)}.disabled{opacity:.5;pointer-events:none}
#timersList>div{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08)}.timer-row{display:flex;flex-direction:column;gap:7px}.collectBtn{width:100%;padding:6px 8px}.collectBtn:disabled{opacity:.5;cursor:not-allowed}footer{margin-top:14px;font-size:12px;color:rgba(230,238,246,.6)}
.subscreen{position:fixed;inset:0;z-index:10;display:none;overflow:auto;background:var(--bg);padding:28px}.subscreen.open{display:block}.subscreen-header{max-width:900px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:16px}.subscreen-content{max-width:900px;margin:18px auto}.subscreen-content h2{margin-top:0}
@media(max-width:900px){main{flex-wrap:wrap}#timers-panel,#sidebar,#play-area{width:100%}#play-area{order:1}#timers-panel{order:2}#sidebar{order:3}}@media(max-width:600px){#upgradesContainer,#buildingUpgradeGrid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:380px){#upgradesContainer,#buildingUpgradeGrid{grid-template-columns:1fr}}
</style>
</head>
<body><div id="game">
<header><h1>Lemon Clicker — Money</h1><div class="controls"><button id="muteBtn">🔊</button></div></header>
<main><aside id="timers-panel"><h3>Building Timers</h3><div id="timersList"></div></aside>
<section id="play-area"><div id="lemon-card"><img id="lemonImg" alt="Lemon"><div id="lemonOverlay"><button id="clicker">🍋</button><div id="perClick">+$1</div><div class="small">Click to earn money.</div></div></div><div id="upgradesContainer"></div></section>
<aside id="sidebar"><div class="stat"><span>Money</span><strong id="money">$0</strong></div><div class="stat"><span>Money / sec</span><strong id="mps">0/s</strong></div><div class="stat"><span>Evolution</span><strong>1</strong></div><div class="stat"><span>Prestige</span><strong>0</strong></div><div class="panel small"><button id="saveBtn">Save</button> <button id="resetBtn">Reset</button></div></aside></main>
<footer>Base click cooldown: <span id="clickCooldownDisplay">250</span> ms</footer></div>

<div id="buildingScreen" class="subscreen" aria-hidden="true"><div class="subscreen-header"><h2 id="buildingScreenTitle">Building Upgrades</h2><button id="closeBuildingScreen" class="buyBtn">Back</button></div><div class="subscreen-content"><div id="buildingUpgradeGrid"></div></div></div>

<script>
(()=>{
const KEY='lemon_money_v2',E=id=>document.getElementById(id);
const shop=[['stand','Lemon Stand',2500,1,5,1,500],['dash','Lemon Dash',15000,6,4,6,600],['depot','Lemon Depot',90000,80,12,80,800],['trading','Lemon Trading',450000,420,10,420,900],['labs','Lemon Labs',2500000,2600,8,2600,1000],['robotics','Lemon Robotics',12000000,11000,6,11000,1100],['republic','Lemon Republic',75000000,62000,14,62000,1200],['lemonx','LemonX',8.8e67,300000,20,350000,1500]];
const global=[['click_power','Upgrade: Click Power',1200000,'Click power +1000'],['click_speed','Upgrade: Click Speed',2000000,'Click cooldown ×0.005']];
const building={stand:[['stand_up1','Upgrade 1',50,'Power ×3'],['stand_up2','Upgrade 2',120,'Interval ×0.8'],['stand_up3','Upgrade 3',300,'Power ×4'],['stand_up4','Upgrade 4',1000,'Power ×4'],['stand_up5','Upgrade 5',1000,'Power ×4'],['stand_up6','Upgrade 6',1000,'Interval ×0.01']],dash:[['dash_up1','Upgrade 1',3000,'Power ×3'],['dash_up2','Upgrade 2',7000,'Interval ×0.85']],depot:[['depot_up1','Upgrade 1',20000,'Power +200']],trading:[['trading_up1','Upgrade 1',80000,'Power +1000']],labs:[['labs_up1','Upgrade 1',250000,'Power +5000']],robotics:[['robotics_up1','Upgrade 1',900000,'Power +20000']],republic:[['republic_up1','Upgrade 1',4000000,'Power +100000']],lemonx:[['lemonx_up1','Upgrade 1',8e66,'Power +1000000']]};
let s={money:1,perClick:1,cooldown:250,lastClick:0,owned:{},managers:{},investors:0,progress:{},lastCollect:{},upgrades:{},muted:false,lastTick:Date.now()};
const fmt=n=>!isFinite(n)?'$0':n<1e6?'$'+Math.floor(n).toLocaleString():'$'+n.toExponential(2);const mult=()=>Math.pow(1.05,s.investors||0);const save=()=>localStorage.setItem(KEY,JSON.stringify(s));function load(){try{Object.assign(s,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}}
function addRow(c,name,desc,cost,id,action){let r=document.createElement('div');r.className='upgrade-row';r.innerHTML='<div class="description"><b>'+name+'</b><div class="small">'+desc+'</div></div>';let b=document.createElement('button');b.className='buyBtn';b.textContent=s.upgrades[id]||s.managers[id]?'Owned':fmt(cost);if(s.upgrades[id]||s.managers[id])b.classList.add('disabled');else b.onclick=()=>{if(s.money>=cost){s.money-=cost;action();save();render()}};r.append(b);c.append(r)}
function renderBuildingOptions(buildId){let c=E('buildingUpgradeGrid');c.innerHTML='';let upgrades=building[buildId]||[];if(!upgrades.length){c.innerHTML='<div class="small">No upgrades available for this building.</div>';return}upgrades.forEach(u=>addRow(c,u[1],u[3],u[2],u[0],()=>{let b=shop.find(x=>x[0]===buildId);if(u[3].includes('Power ×'))b[3]*=+u[3].match(/\d+/)[0];else if(u[3].includes('Power +'))b[3]+=+u[3].match(/\d+/)[0];else b[4]*=+u[3].match(/\d+(?:\.\d+)?/)[0]}))}
function openBuildingScreen(buildId){let b=shop.find(x=>x[0]===buildId);if(!b)return;E('buildingScreenTitle').textContent=b[1]+' Upgrades';renderBuildingOptions(buildId);E('buildingScreen').classList.add('open');E('buildingScreen').setAttribute('aria-hidden','false')}
function closeBuildingScreen(){E('buildingScreen').classList.remove('open');E('buildingScreen').setAttribute('aria-hidden','true')}
function addBuildingRow(c,b){let r=document.createElement('div');r.className='building-option';r.innerHTML='<b>'+b[1]+'</b><div class="small">View '+(building[b[0]]||[]).length+' building upgrades</div><button class="buyBtn">Open</button>';r.onclick=()=>openBuildingScreen(b[0]);c.append(r)}
function collect(buildId){let b=shop.find(x=>x[0]===buildId);if(!b||!s.owned[buildId]||s.managers[buildId])return;let now=Date.now(),last=s.lastCollect[buildId]||0;if(now-last<b[6])return;let progress=s.progress[buildId]||0,cycles=Math.floor(progress/b[4]);let gain=cycles?cycles*b[3]:b[5];s.money+=gain*mult();s.progress[buildId]=cycles?progress% b[4]:0;s.lastCollect[buildId]=now;save();render()}
function renderOptions(){let c=E('upgradesContainer');c.innerHTML='';let h=t=>{let x=document.createElement('div');x.className='upgrade-section';x.textContent=t;c.append(x)};h('Shop');shop.forEach(b=>{let[id,n,cost,power,int]=b;addRow(c,n,'One-time purchase · '+power+'/cycle every '+int+'s',cost,'shop_'+id,()=>{s.owned[id]=1})});h('Investors');addRow(c,'Angel Investor','Permanent +5% money multiplier',10000,'investor',()=>s.investors++);h('Global upgrades');global.forEach(u=>addRow(c,u[1],u[3],u[2],u[0],()=>{if(u[0]=='click_power')s.perClick+=1000;else s.cooldown=Math.max(30,Math.floor(s.cooldown*.005))}));h('Managers');shop.forEach(b=>{let[id,n,cost]=b;addRow(c,n+' Manager','Automates '+n,cost,'manager_'+id,()=>s.managers[id]=1)});h('Building upgrades');shop.forEach(b=>addBuildingRow(c,b))}
function render(){E('money').textContent=fmt(s.money);E('mps').textContent=Math.floor(shop.reduce((n,b)=>n+(s.owned[b[0]]&&s.managers[b[0]]?b[3]/b[4]:0),0)*mult())+'/s';E('perClick').textContent='+$'+s.perClick;E('clickCooldownDisplay').textContent=s.cooldown;E('muteBtn').textContent=s.muted?'🔇':'🔊';renderOptions();let t=E('timersList');t.innerHTML='';shop.forEach(b=>{if(!s.owned[b[0]])return;let automated=!!s.managers[b[0]],remaining=Math.max(0,b[4]-(s.progress[b[0]]||0));t.innerHTML+='<div class="timer-row"><b>'+b[1]+'</b><span class="small">'+(automated?'Automated · '+remaining.toFixed(1)+'s remaining':'Progress: '+Math.floor(s.progress[b[0]]||0)+'/'+b[4]+'s')+'</span>'+(automated?'':'<button class="collectBtn" data-collect="'+b[0]+'">Collect</button>')+'</div>'});if(!t.innerHTML)t.textContent='Own a building to see its timer here.';t.querySelectorAll('[data-collect]').forEach(btn=>btn.onclick=()=>collect(btn.dataset.collect))}
function tick(){let now=Date.now(),dt=(now-s.lastTick)/1000;s.lastTick=now;shop.forEach(b=>{if(!s.owned[b[0]])return;s.progress[b[0]]=(s.progress[b[0]]||0)+dt;if(s.managers[b[0]]){let q=Math.floor(s.progress[b[0]]/b[4]);s.money+=q*b[3]*mult();s.progress[b[0]]%=b[4]}});render()}
load();shop.forEach(b=>{s.owned[b[0]]??=false;s.progress[b[0]]??=0;s.lastCollect[b[0]]??=0});if(!Object.values(s.owned).some(Boolean))s.owned.stand=true;E('clicker').onclick=()=>{let n=Date.now();if(n-s.lastClick>=s.cooldown){s.lastClick=n;s.money+=s.perClick*mult();render()}};E('saveBtn').onclick=save;E('resetBtn').onclick=()=>{if(confirm('Reset save?')){localStorage.removeItem(KEY);location.reload()}};E('muteBtn').onclick=()=>{s.muted=!s.muted;save();render()};E('closeBuildingScreen').onclick=closeBuildingScreen;E('lemonImg').src='https://source.unsplash.com/1600x900/?lemon';render();setInterval(tick,1000)
})();
</script></body></html>
