<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lemon Clicker — Money Edition</title>
  <style>
    :root {
      --bg: #081218;
      --panel: rgba(255,255,255,.06);
      --panel-strong: rgba(255,255,255,.09);
      --text: #edf6ff;
      --muted: rgba(237,246,255,.8);
      --accent: #f6b93b;
      --good: #8ee38e;
      --warning: #ffdb6e;
      --danger: #ff5b5b;
      --shadow: rgba(0,0,0,.25);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button {
      background: var(--accent);
      color: #081218;
      border: none;
      border-radius: 8px;
      padding: 8px 10px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.9rem;
      transition: transform .12s ease, filter .12s ease, opacity .12s ease;
      box-shadow: 0 2px 12px rgba(0,0,0,.15);
      touch-action: manipulation;
    }

    button:hover:not(:disabled) { filter: brightness(1.04); }
    button:active:not(:disabled) { transform: translateY(1px) scale(.99); }
    button:disabled { opacity: .55; cursor: not-allowed; }

    .app {
      max-width: 100vw;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 12px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      flex-shrink: 0;
    }

    .topbar h1 {
      margin: 0;
      font-size: clamp(1.1rem, 2vw, 1.5rem);
      letter-spacing: .02em;
    }

    .main-content {
      display: grid;
      grid-template-columns: 160px minmax(0, 1fr) 170px 200px;
      gap: 12px;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .panel {
      background: var(--panel);
      border-radius: 12px;
      padding: 10px;
      font-size: 0.85rem;
      overflow-y: auto;
      border: 1px solid rgba(255,255,255,.04);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
    }

    .panel h3, .panel h4 { margin: 0 0 8px; font-size: 0.95rem; }
    .panel h3 { margin-top: 10px; margin-bottom: 6px; }
    .panel h3:first-child { margin-top: 0; }

    .card { background: var(--panel); border-radius: 12px; padding: 12px; }

    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,.08);
      font-size: 0.85rem;
    }

    .stat-row:last-child { border-bottom: 0; }

    .lemon-card {
      position: relative;
      height: 100%;
      min-height: 220px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 12px;
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.04);
    }

    .lemon-card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: .14;
      pointer-events: none;
    }

    .lemon-inner {
      position: relative;
      z-index: 1;
      text-align: center;
    }

    #clicker {
      font-size: 52px;
      border-radius: 999px;
      width: 100px;
      height: 100px;
      padding: 0;
    }

    .combo { color: var(--warning); font-weight: 800; font-size: 0.9rem; }

    .juice-tank {
      position: relative;
      width: 100%;
      height: 120px;
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      border: 2px solid rgba(255,255,255,0.1);
      overflow: hidden;
      margin-bottom: 8px;
    }

    .juice-fill {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 0%;
      background: var(--accent);
      transition: height 0.3s ease;
    }

    .juice-label {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      font-weight: 700;
      font-size: 0.9rem;
      text-shadow: 0 0 4px rgba(0,0,0,0.8);
    }

    .upgrade-btn { padding: 6px 8px; font-size: 0.75rem; }

    .shop {
      display: grid;
      gap: 6px;
      min-width: 0;
      width: 160px;
      max-height: 160px;
      overflow-y: auto;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--panel-strong);
      border-radius: 8px;
      padding: 8px;
      font-size: 0.8rem;
      border: 1px solid rgba(255,255,255,.04);
    }

    .row .info { flex: 1; min-width: 0; }
    .row .info b { display: block; }
    .small { font-size: 0.75rem; color: var(--muted); }
    .owned { color: var(--good); font-weight: 700; }

    .screen {
      position: fixed;
      inset: 0;
      display: none;
      background: rgba(8,18,24,0.94);
      z-index: 20;
      padding: 20px;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .screen.open {
      display: flex;
      flex-direction: column;
    }

    .screen-header {
      margin: 0 0 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .screen-header h2 { margin: 0; }
    .screen-content { flex: 1; overflow-y: auto; }

    .money-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--panel);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 1.1rem;
      margin-bottom: 18px;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,.04);
    }

    .progress-bar {
      height: 8px;
      background: rgba(255,255,255,.08);
      border-radius: 999px;
      overflow: hidden;
      margin: 8px 0;
    }

    .progress-bar > span {
      display: block;
      height: 100%;
      width: 0;
      background: var(--accent);
    }

    .floating-text {
      position: fixed;
      z-index: 40;
      pointer-events: none;
      font-weight: 800;
      color: var(--accent);
      text-shadow: 0 2px 12px rgba(0,0,0,.25);
      animation: floatUp 1s ease forwards;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-60px) scale(1.3); }
    }

    @media (max-width: 1400px) {
      .main-content {
        grid-template-columns: 1fr;
      }

      .app { padding: 8px; }
      .shop { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1 id="title">Lemon Clicker — Money</h1>
      <div style="display: flex; gap: 8px;">
        <button id="upgradesBtn" style="padding: 6px 12px;">Upgrades</button>
        <button id="muteBtn" style="padding: 6px 12px;">🔊</button>
      </div>
    </header>

    <div class="main-content">
      <aside>
        <div class="panel">
          <h3>Timers</h3>
          <div id="timers" style="font-size: 0.75rem;"></div>
        </div>
        <div class="panel">
          <h3>Quests</h3>
          <div id="quests" style="font-size: 0.75rem;"></div>
        </div>
      </aside>

      <main style="display: flex; flex-direction: column; gap: 12px; overflow: hidden; min-width: 0;">
        <div class="lemon-card">
          <img id="fruitImage" alt="fruit background" src="https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?auto=format&fit=crop&w=1200&q=80">
          <div class="lemon-inner">
            <button id="clicker">🍋</button>
            <div id="perClick" style="font-size: 0.9rem; margin-top: 8px;">+$1</div>
            <div id="combo" class="combo">Combo ×1</div>
          </div>
        </div>

        <div style="display: flex; gap: 12px; overflow: hidden; min-width: 0; align-items: stretch;">
          <div style="flex: 1; min-height: 0; min-width: 0;">
            <div class="juice-tank">
              <div class="juice-fill" id="juiceFill"></div>
              <div class="juice-label" id="juiceLabel">Juice 0%</div>
            </div>
            <div style="text-align: center; font-size: 0.75rem;">
              <span>Juice Multiplier: <strong id="juiceMultiplier">1.00x</strong></span>
            </div>
          </div>
          <div id="shop" class="shop"></div>
        </div>
      </main>

      <aside>
        <div class="panel">
          <div class="stat-row"><span>Money</span><strong id="money">$0</strong></div>
          <div class="stat-row"><span>Money/s</span><strong id="mps">0/s</strong></div>
          <h3>Ascend</h3>
          <div class="stat-row"><span>Evolution</span><strong id="evolution">1</strong></div>
          <div class="stat-row"><span>Prestige</span><strong id="prestige">0</strong></div>
          <div class="stat-row"><span>Investors</span><strong id="investors">0</strong></div>
          <div style="margin-top: 8px; display: flex; flex-direction: column; gap: 6px;">
            <button id="investorBtn" class="upgrade-btn">Buy Investor</button>
            <button id="evolutionBtn" class="upgrade-btn">Evolve</button>
            <button id="prestigeBtn" class="upgrade-btn" style="width: 100%;">Prestige</button>
          </div>
          <h3>Saves</h3>
          <div style="display: flex; gap: 6px; flex-direction: column;">
            <button id="saveBtn" class="upgrade-btn" style="width: 100%;">Save</button>
            <button id="resetBtn" class="upgrade-btn" style="width: 100%;">Reset</button>
          </div>
          <div id="message" class="small" style="margin-top: 8px; min-height: 18px;"></div>
        </div>
      </aside>

      <aside>
        <div class="panel">
          <h3>Events</h3>
          <div id="eventText" class="small">No event</div>
          <div class="progress-bar"><span id="eventBar"></span></div>
          <h3>Achievements</h3>
          <div id="achievements" style="font-size: 0.7rem;"></div>
        </div>
      </aside>
    </div>
  </div>

  <div id="upgradesScreen" class="screen" aria-modal="true" role="dialog" aria-label="Upgrades">
    <div class="screen-header">
      <h2>Upgrades</h2>
      <button id="closeUpgrades">Close</button>
    </div>
    <div class="screen-content">
      <div class="money-banner"><span>Current Money</span><strong id="upgradeMoney">$0</strong></div>
      <h3>Global Upgrades</h3>
      <div id="globalUpgradeGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; margin-bottom: 20px;"></div>
      <h3>Manager Upgrades</h3>
      <div id="managerGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; margin-bottom: 20px;"></div>
      <h3>Building Upgrades</h3>
      <div id="buildingGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px;"></div>
    </div>
  </div>

  <script>
  let buildings = [];
  let audioCtx = null;

  const SAVE_KEY = 'lemon_money_v2';
  const MAX = 8.8e67;
  const BASE_BUILDING_COST = 250;

  const FRUITS = [
    { name: 'Lemon', color: '#f6b93b', emoji: '🍋' },
    { name: 'Orange', color: '#f28c28', emoji: '🍊' },
    { name: 'Lime', color: '#a5f57a', emoji: '🍈' },
    { name: 'Grapefruit', color: '#ff8fa3', emoji: '🍊' },
    { name: 'Sour???', color: '#4caf50', emoji: '🍏' }
  ];

  const BUILDINGS = [
    ['stand', 'Lemon Stand', 1, 5],
    ['dash', 'Lemon Dash', 4, 4],
    ['depot', 'Lemon Depot', 16, 12],
    ['trading', 'Lemon Trading', 64, 10],
    ['labs', 'Lemon Labs', 256, 8],
    ['robotics', 'Lemon Robotics', 1024, 6],
    ['republic', 'Lemon Republic', 4096, 14],
    ['lemonx', 'LemonX', 16384, 20]
  ];

  const GLOBAL_UPGRADES = [
    { id: 'click_power', name: 'Click Power', desc: '+1000 per click', cost: 1200000, apply: (state) => { state.perClick += 1000; } },
    { id: 'click_speed', name: 'Click Speed', desc: 'Reduce click cooldown', cost: 2000000, apply: (state) => { state.cooldown = Math.max(30, Math.floor(state.cooldown * 0.7)); } },
    { id: 'offline_boost', name: 'Offline Boost', desc: '+25% offline cash', cost: 5000000, apply: (state) => { state.offlineMultiplier = (state.offlineMultiplier || 1) * 1.25; } }
  ];

  const BUILDING_UPGRADE_EFFECTS = [
    'Power ×2', 'Interval ×0.8', 'Power ×3', 'Power +20', 'Interval ×0.75', 'Power ×4', 'Power +50', 'Interval ×0.7'
  ];

  const ACHIEVEMENT_MILESTONES = {
    clicks: [10, 25, 50, 100, 200, 300, 400, 500, 750, 1000],
    mps: [1, 10, 100, 1000, 10000],
    totalMoney: [1000, 10000, 100000, 1000000, 10000000],
    investors: [1, 5, 10, 25, 50],
    evolves: [1, 2, 3, 5, 10],
    ascends: [1, 2, 3, 5, 10]
  };

  const state = {
    money: 1,
    perClick: 1,
    cooldown: 250,
    lastClick: 0,
    owned: {},
    managers: {},
    progress: {},
    upgrades: {},
    buildingStats: {},
    investors: 0,
    evolution: 1,
    prestige: 0,
    prestigeCost: 1000000,
    lastSavedAt: Date.now(),
    lastTick: Date.now(),
    combo: 1,
    lastComboAt: 0,
    clicks: 0,
    totalEarned: 0,
    collectibles: 0,
    achievements: {},
    quests: {},
    event: null,
    eventEndsAt: 0,
    eventMultiplier: 1,
    offlineMultiplier: 1,
    investorMultiplier: 1,
    evolveMultiplier: 1,
    muted: false,
    juice: 0,
    juiceMultiplier: 1,
    totalInvestorsEver: 0,
    totalEvolvesEver: 0,
    totalPrestigesEver: 0
  };

  function clamp(value, min, max) {
    if (!Number.isFinite(value)) return min;
    return Math.min(Math.max(value, min), max);
  }

  function safeNumber(value, fallback = 0) {
    return Number.isFinite(value) ? value : fallback;
  }

  function fmt(n) {
    const safe = safeNumber(n, 0);
    if (!Number.isFinite(safe)) return '$∞';
    if (safe < 1e6) return '$' + Math.floor(safe).toLocaleString();
    return '$' + safe.toExponential(2);
  }

  function buildingCost(index) {
    let cost = BASE_BUILDING_COST;
    for (let i = 1; i <= index; i++) {
      cost = Math.min(MAX, Math.round(cost * cost));
    }
    return cost;
  }

  function buildingUpgradeCost(buildingId, index) {
    const buildingIndex = BUILDINGS.findIndex(([id]) => id === buildingId);
    const base = buildingCost(buildingIndex >= 0 ? buildingIndex : 0);
    return Math.min(MAX, Math.ceil(base * (1.7 ** (index + 1))));
  }

  function normalizeState() {
    state.owned = state.owned || {};
    state.managers = state.managers || {};
    state.progress = state.progress || {};
    state.upgrades = state.upgrades || {};
    state.buildingStats = state.buildingStats || {};
    state.achievements = state.achievements || {};
    state.quests = state.quests || {};
    state.money = safeNumber(state.money, 0);
    state.perClick = safeNumber(state.perClick, 1);
    state.cooldown = clamp(safeNumber(state.cooldown, 250), 30, 5000);
    state.combo = clamp(safeNumber(state.combo, 1), 1, 10000);
    state.juice = safeNumber(state.juice, 0);
    state.juiceMultiplier = safeNumber(state.juiceMultiplier, 1);
    state.offlineMultiplier = safeNumber(state.offlineMultiplier, 1);
    state.investorMultiplier = safeNumber(state.investorMultiplier, 1);
    state.evolveMultiplier = safeNumber(state.evolveMultiplier, 1);
    state.investors = safeNumber(state.investors, 0);
    state.evolution = Math.max(1, Math.floor(safeNumber(state.evolution, 1)));
    state.prestige = safeNumber(state.prestige, 0);
    state.prestigeCost = Math.max(1, safeNumber(state.prestigeCost, 1000000));
    state.totalInvestorsEver = safeNumber(state.totalInvestorsEver, 0);
    state.totalEvolvesEver = safeNumber(state.totalEvolvesEver, 0);
    state.totalPrestigesEver = safeNumber(state.totalPrestigesEver, 0);
    state.totalEarned = safeNumber(state.totalEarned, 0);
    state.clicks = safeNumber(state.clicks, 0);
  }

  function save() {
    normalizeState();
    state.lastSavedAt = Date.now();
    try {
      if (window.localStorage) {
        localStorage.setItem(SAVE_KEY, JSON.stringify(state));
      }
    } catch (err) {
      console.warn('Save failed:', err);
    }
  }

  function load() {
    try {
      if (window.localStorage) {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return;
        const saved = JSON.parse(raw);
        Object.assign(state, saved);
      }
    } catch (err) {
      console.warn('Save load failed:', err);
    }
    normalizeState();
  }

  function getCurrentFruit() {
    const idx = Math.max(0, (Math.floor(state.evolution) - 1) % FRUITS.length);
    return FRUITS[idx];
  }

  function getEvolutionRequirement() {
    let req = 10;
    for (let i = 1; i < state.evolution; i++) req = Math.ceil(req * 1.5);
    return req;
  }

  function syncBuildingData() {
    buildings = BUILDINGS.map(([id, name, power, interval], idx) => ({
      id,
      name,
      power: safeNumber(state.buildingStats[id]?.power, power),
      interval: Math.max(0.5, safeNumber(state.buildingStats[id]?.interval, interval)),
      cost: buildingCost(idx)
    }));
  }

  function persistBuildings() {
    state.buildingStats = {};
    buildings.forEach((b) => {
      state.buildingStats[b.id] = { power: b.power, interval: b.interval };
    });
  }

  function baseProductionPerSecond() {
    return buildings.reduce((total, b) => {
      if (!state.owned[b.id]) return total;
      if (state.managers[b.id]) return total + (b.power / b.interval);
      return total;
    }, 0);
  }

  function getCurrentEventMultiplier() {
    let mult = 1;
    if (state.event) mult *= state.event.multiplier;
    return mult;
  }

  function getJuiceMultiplier() {
    const maxJuice = ACHIEVEMENT_MILESTONES.clicks[ACHIEVEMENT_MILESTONES.clicks.length - 1];
    const ratio = Math.min(1, state.juice / maxJuice);
    return 1 + ratio * 1.5;
  }

  function updateJuiceMultiplier() {
    state.juiceMultiplier = getJuiceMultiplier();
  }

  function ghostText(text, x, y) {
    const el = document.createElement('div');
    el.className = 'floating-text';
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1000);
  }

  function message(text) {
    const el = document.getElementById('message');
    if (!el) return;
    el.textContent = text;
    clearTimeout(message.timeout);
    message.timeout = setTimeout(() => { el.textContent = ''; }, 2200);
  }

  function setEvent() {
    if (state.event && Date.now() < state.eventEndsAt) return;
    if (Math.random() < 0.15 || state.event === null) {
      const events = [
        { name: 'Golden Lemon', multiplier: 2.5 },
        { name: 'Lemon Rush', multiplier: 3 },
        { name: 'Fruit Festival', multiplier: 2 },
        { name: 'Market Boom', multiplier: 1.8 }
      ];
      const pick = events[Math.floor(Math.random() * events.length)];
      state.event = pick;
      state.eventEndsAt = Date.now() + 30000;
      state.eventMultiplier = pick.multiplier;
      message(pick.name + ' started!');
    } else {
      state.event = null;
      state.eventMultiplier = 1;
    }
  }

  function resetRun() {
    state.money = 1;
    state.perClick = 1;
    state.cooldown = 250;
    state.lastClick = 0;
    state.owned = {};
    state.managers = {};
    state.progress = {};
    state.upgrades = {};
    state.buildingStats = {};
    state.combo = 1;
    state.lastComboAt = 0;
    state.clicks = 0;
    state.totalEarned = 0;
    state.event = null;
    state.eventEndsAt = 0;
    state.eventMultiplier = 1;
    state.juice = 0;
    syncBuildingData();
    state.owned.stand = true;
  }

  function buyBuilding(id) {
    const b = buildings.find((x) => x.id === id);
    if (!b) return;
    if (state.money >= b.cost) {
      state.money -= b.cost;
      state.owned[id] = true;
      state.progress[id] = 0;
      save();
      render();
    }
  }

  function collectBuilding(id) {
    const b = buildings.find((x) => x.id === id);
    if (!b || !state.owned[id] || state.managers[id]) return;
    const current = safeNumber(state.progress[id], 0);
    if (current < b.interval) return;
    const earned = Math.floor(current / b.interval) * b.power * getCurrentEventMultiplier();
    state.money += earned;
    state.totalEarned += earned;
    state.collectibles += Math.floor(current / b.interval);
    state.progress[id] = current % b.interval;
    save();
    render();
  }

  function globalUpgradeBuy(entry) {
    if (state.money < entry.cost) return;
    if (state.upgrades[entry.id]) return;
    state.money -= entry.cost;
    state.upgrades[entry.id] = true;
    entry.apply(state);
    state.juice += 5;
    updateJuiceMultiplier();
    save();
    render();
  }

  function managerBuy(id, cost) {
    if (state.money < cost) return;
    if (state.managers[id]) return;
    state.money -= cost;
    state.managers[id] = true;
    save();
    render();
  }

  function addUpgradeRow(container, name, desc, cost, owned, onBuy) {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = '<div class="info"><b>' + name + '</b><div class="small">' + desc + '</div>' + (owned ? '<div class="owned">Owned</div>' : '') + '</div>';
    const button = document.createElement('button');
    button.textContent = owned ? 'Owned' : fmt(cost);
    button.disabled = owned;
    button.onclick = () => onBuy();
    row.appendChild(button);
    container.appendChild(row);
  }

  function renderGlobalUpgrades() {
    const grid = document.getElementById('globalUpgradeGrid');
    if (!grid) return;
    grid.innerHTML = '';
    GLOBAL_UPGRADES.forEach((entry) => {
      const owned = !!state.upgrades[entry.id];
      addUpgradeRow(grid, entry.name, entry.desc, entry.cost, owned, () => globalUpgradeBuy(entry));
    });
  }

  function renderManagerUpgrades() {
    const grid = document.getElementById('managerGrid');
    if (!grid) return;
    grid.innerHTML = '';
    buildings.forEach((b) => {
      const owned = !!state.managers[b.id];
      addUpgradeRow(grid, b.name + ' Manager', 'Automates ' + b.name, b.cost, owned, () => managerBuy(b.id, b.cost));
    });
  }

  function renderBuildingUpgradeList() {
    const grid = document.getElementById('buildingGrid');
    if (!grid) return;
    grid.innerHTML = '';
    grid.style.gridTemplateColumns = 'repeat(auto-fill, minmax(250px, 1fr))';
    buildings.forEach((b) => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = '<div class="info"><b>' + b.name + '</b><div class="small">View upgrades</div></div>';
      const button = document.createElement('button');
      button.textContent = 'Open';
      button.onclick = () => renderBuildingScreen(b.id);
      row.appendChild(button);
      grid.appendChild(row);
    });
  }

  function renderBuildingScreen(id) {
    const b = buildings.find((x) => x.id === id);
    if (!b) return;
    const panel = document.getElementById('buildingGrid');
    if (!panel) return;
    panel.innerHTML = '';
    panel.style.gridTemplateColumns = '1fr';

    const title = document.createElement('div');
    title.className = 'money-banner';
    title.innerHTML = '<span>' + b.name + ' Upgrades</span><button id="backToBuildings">Back</button>';
    title.querySelector('button').onclick = () => renderBuildingUpgradeList();
    panel.appendChild(title);

    BUILDING_UPGRADE_EFFECTS.forEach((effect, index) => {
      const owned = !!state.buildingStats[id]?.upgrades?.[index];
      const cost = buildingUpgradeCost(id, index);
      addUpgradeRow(panel, 'Upgrade ' + (index + 1), effect, cost, owned, () => {
        if (state.money < cost || owned) return;
        state.money -= cost;
        const entry = state.buildingStats[id] || {};
        entry.upgrades = entry.upgrades || {};
        entry.upgrades[index] = true;
        state.buildingStats[id] = entry;

        const target = buildings.find((x) => x.id === id);
        if (!target) return;

        const match = effect.match(/\d+(?:\.\d+)?/);
        const amt = match ? Number(match[0]) : 1;
        if (effect.includes('Power')) {
          target.power *= effect.includes('×') ? amt : 1 + amt / 100;
        }
        if (effect.includes('Interval')) {
          target.interval = Math.max(0.5, target.interval * (effect.includes('×') ? amt : 1 - amt / 100));
        }

        persistBuildings();
        save();
        render();
      });
    });
  }

  function renderShop() {
    const el = document.getElementById('shop');
    if (!el) return;
    el.innerHTML = '';
    buildings.forEach((b) => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = '<div class="info"><b>' + b.name + '</b><div class="small">' + (state.owned[b.id] ? 'Owned' : '1x buy') + '</div></div>';
      const button = document.createElement('button');
      button.textContent = state.owned[b.id] ? 'Own' : fmt(b.cost);
      button.disabled = !!state.owned[b.id];
      button.onclick = () => buyBuilding(b.id);
      row.appendChild(button);
      el.appendChild(row);
    });
  }

  function renderTimers() {
    const el = document.getElementById('timers');
    if (!el) return;
    el.innerHTML = '';

    buildings.forEach((b) => {
      if (!state.owned[b.id]) return;
      const p = safeNumber(state.progress[b.id], 0);
      const row = document.createElement('div');
      row.style.marginTop = '6px';
      row.innerHTML = '<b>' + b.name + '</b><div class="small">' + (state.managers[b.id] ? 'Auto' : Math.floor(p) + '/' + b.interval + 's') + '</div>' +
        '<div class="progress-bar"><span style="width:' + Math.min(100, p / b.interval * 100) + '%"></span></div>' +
        (state.managers[b.id] ? '' : '<button data-id="' + b.id + '" style="width:100%; padding: 4px; font-size: 0.7rem; margin-top: 4px;">Collect</button>');
      el.appendChild(row);
    });

    el.querySelectorAll('[data-id]').forEach((button) => {
      button.onclick = () => collectBuilding(button.dataset.id);
    });
  }

  function renderAchievements() {
    const container = document.getElementById('achievements');
    if (!container) return;
    container.innerHTML = '';

    const achievements = [
      { label: 'Clicks', key: 'clicks', data: ACHIEVEMENT_MILESTONES.clicks, current: state.clicks },
      { label: 'MPS', key: 'mps', data: ACHIEVEMENT_MILESTONES.mps, current: Math.floor(baseProductionPerSecond() * getCurrentEventMultiplier()) },
      { label: 'Total $', key: 'totalMoney', data: ACHIEVEMENT_MILESTONES.totalMoney, current: state.totalEarned },
      { label: 'Investors', key: 'investors', data: ACHIEVEMENT_MILESTONES.investors, current: state.totalInvestorsEver },
      { label: 'Evolves', key: 'evolves', data: ACHIEVEMENT_MILESTONES.evolves, current: state.totalEvolvesEver },
      { label: 'Ascends', key: 'ascends', data: ACHIEVEMENT_MILESTONES.ascends, current: state.totalPrestigesEver }
    ];

    achievements.forEach((ach) => {
      const row = document.createElement('div');
      row.style.marginBottom = '3px';

      const nextTarget = ach.data.find((m) => state.achievements[ach.key + '_' + m] === undefined);
      if (nextTarget === undefined) {
        row.textContent = '✅ ' + ach.label + ' (MAX)';
      } else {
        const unlocked = ach.data.filter((m) => state.achievements[ach.key + '_' + m]).length;
        row.textContent = '✅ '.repeat(unlocked) + '⬜ ' + ach.label + ' ' + ach.current + '/' + nextTarget;
      }

      container.appendChild(row);
    });

    ACHIEVEMENT_MILESTONES.clicks.forEach((milestone) => {
      const id = 'clicks_' + milestone;
      if (!state.achievements[id] && state.clicks >= milestone) {
        state.achievements[id] = true;
        state.juice += 1;
        updateJuiceMultiplier();
        message('Click Streak ×' + milestone + ' unlocked!');
      }
    });

    ACHIEVEMENT_MILESTONES.mps.forEach((milestone) => {
      const id = 'mps_' + milestone;
      if (!state.achievements[id] && Math.floor(baseProductionPerSecond() * getCurrentEventMultiplier()) >= milestone) {
        state.achievements[id] = true;
        state.juice += 1;
        updateJuiceMultiplier();
        message('MPS ×' + milestone + ' unlocked!');
      }
    });

    ACHIEVEMENT_MILESTONES.totalMoney.forEach((milestone) => {
      const id = 'totalMoney_' + milestone;
      if (!state.achievements[id] && state.totalEarned >= milestone) {
        state.achievements[id] = true;
        state.juice += 1;
        updateJuiceMultiplier();
        message('Earned ' + fmt(milestone) + ' unlocked!');
      }
    });

    ACHIEVEMENT_MILESTONES.investors.forEach((milestone) => {
      const id = 'investors_' + milestone;
      if (!state.achievements[id] && state.totalInvestorsEver >= milestone) {
        state.achievements[id] = true;
        state.juice += 1;
        updateJuiceMultiplier();
        message('Investors ×' + milestone + ' unlocked!');
      }
    });

    ACHIEVEMENT_MILESTONES.evolves.forEach((milestone) => {
      const id = 'evolves_' + milestone;
      if (!state.achievements[id] && state.totalEvolvesEver >= milestone) {
        state.achievements[id] = true;
        state.juice += 1;
        updateJuiceMultiplier();
        message('Evolutions ×' + milestone + ' unlocked!');
      }
    });

    ACHIEVEMENT_MILESTONES.ascends.forEach((milestone) => {
      const id = 'ascends_' + milestone;
      if (!state.achievements[id] && state.totalPrestigesEver >= milestone) {
        state.achievements[id] = true;
        state.juice += 1;
        updateJuiceMultiplier();
        message('Prestige ×' + milestone + ' unlocked!');
      }
    });
  }

  function renderQuests() {
    const container = document.getElementById('quests');
    if (!container) return;

    const defs = [
      ['click_25', 'Click 25×', () => state.clicks >= 25],
      ['money_1k', 'Earn $1k', () => state.totalEarned >= 1000],
      ['investor_1', 'Get Investor', () => state.totalInvestorsEver >= 1]
    ];

    container.innerHTML = '';
    defs.forEach(([id, label, check]) => {
      const done = state.quests[id] || check();
      if (done && !state.quests[id]) {
        state.quests[id] = true;
        state.money += 250;
        message(label + ' complete!');
      }
      const row = document.createElement('div');
      row.style.marginBottom = '4px';
      row.textContent = (done ? '✅' : '⬜') + ' ' + label;
      container.appendChild(row);
    });
  }

  function updateEventDisplay() {
    const text = document.getElementById('eventText');
    const bar = document.getElementById('eventBar');
    if (!text || !bar) return;

    if (!state.event || Date.now() >= state.eventEndsAt) {
      state.event = null;
      state.eventMultiplier = 1;
      text.textContent = 'No event';
      bar.style.width = '0%';
      return;
    }

    const remaining = Math.max(0, (state.eventEndsAt - Date.now()) / 30000);
    text.textContent = state.event.name + ' ×' + state.event.multiplier;
    bar.style.width = (remaining * 100) + '%';
  }

  function updateJuiceDisplay() {
    const fill = document.getElementById('juiceFill');
    const label = document.getElementById('juiceLabel');
    const juiceText = document.getElementById('juiceMultiplier');

    if (!fill || !label || !juiceText) return;

    const fruit = getCurrentFruit();
    const maxJuice = ACHIEVEMENT_MILESTONES.clicks[ACHIEVEMENT_MILESTONES.clicks.length - 1];
    const percentage = Math.min(100, (state.juice / maxJuice) * 100);
    fill.style.background = fruit.color;
    fill.style.height = percentage + '%';
    label.textContent = 'Juice ' + Math.floor(percentage) + '%';
    juiceText.textContent = state.juiceMultiplier.toFixed(2) + 'x';
  }

  function render() {
    const fruit = getCurrentFruit();
    document.documentElement.style.setProperty('--accent', fruit.color);

    const title = document.getElementById('title');
    const clicker = document.getElementById('clicker');
    const money = document.getElementById('money');
    const mps = document.getElementById('mps');
    const perClick = document.getElementById('perClick');
    const evolution = document.getElementById('evolution');
    const prestige = document.getElementById('prestige');
    const investors = document.getElementById('investors');
    const upgradeMoney = document.getElementById('upgradeMoney');
    const combo = document.getElementById('combo');
    const investorBtn = document.getElementById('investorBtn');
    const evolutionBtn = document.getElementById('evolutionBtn');
    const prestigeBtn = document.getElementById('prestigeBtn');
    const muteBtn = document.getElementById('muteBtn');

    if (title) title.textContent = fruit.name + ' Clicker — Money';
    if (clicker) clicker.textContent = fruit.emoji;
    if (money) money.textContent = fmt(state.money);
    if (mps) mps.textContent = Math.floor(baseProductionPerSecond() * getCurrentEventMultiplier()) + '/s';
    if (perClick) perClick.textContent = '+$' + Math.floor(state.perClick * state.juiceMultiplier) + ' (×' + state.juiceMultiplier.toFixed(2) + ')';
    if (evolution) evolution.textContent = fruit.name;
    if (prestige) prestige.textContent = state.prestige;
    if (investors) investors.textContent = state.investors;
    if (upgradeMoney) upgradeMoney.textContent = fmt(state.money);
    if (combo) combo.textContent = 'Combo ×' + Math.max(1, state.combo);
    if (investorBtn) investorBtn.textContent = 'Investor (' + fmt(100 * (2 ** state.investors)) + ')';
    if (evolutionBtn) evolutionBtn.textContent = 'Evolve (' + getEvolutionRequirement() + ')';
    if (prestigeBtn) prestigeBtn.textContent = 'Prestige (' + fmt(state.prestigeCost) + ')';
    if (muteBtn) muteBtn.textContent = state.muted ? '🔇' : '🔊';

    renderShop();
    renderTimers();
    renderAchievements();
    renderQuests();
    renderGlobalUpgrades();
    renderManagerUpgrades();
    renderBuildingUpgradeList();
    updateEventDisplay();
    updateJuiceDisplay();
  }

  function tick() {
    setEvent();
    const now = Date.now();
    const delta = (now - state.lastTick) / 1000;
    state.lastTick = now;

    buildings.forEach((b) => {
      if (!state.owned[b.id]) return;
      state.progress[b.id] = safeNumber(state.progress[b.id], 0) + delta;
      if (state.managers[b.id]) {
        const interval = b.interval;
        const cycles = Math.floor(state.progress[b.id] / interval);
        if (cycles > 0) {
          const profit = cycles * b.power * getCurrentEventMultiplier();
          state.money += profit;
          state.totalEarned += profit;
          state.progress[b.id] %= interval;
        }
      }
    });

    render();
  }

  function applyOfflineEarnings() {
    const now = Date.now();
    const elapsed = Math.max(0, (now - (state.lastSavedAt || now)) / 1000);
    const seconds = Math.min(4 * 60 * 60, elapsed);
    if (seconds <= 0) return;

    const hourlyBase = baseProductionPerSecond();
    const offline = hourlyBase * seconds * state.offlineMultiplier * 0.4;
    if (offline > 0) {
      state.money += offline;
      message('Offline: ' + fmt(offline));
    }
  }

  function initAudio() {
    if (!window.AudioContext && !window.webkitAudioContext) return null;
    return new (window.AudioContext || window.webkitAudioContext)();
  }

  function playTone(freq, duration = 0.08, type = 'sine') {
    if (state.muted) return;
    if (!audioCtx) audioCtx = initAudio();
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.06, audioCtx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }

  function buyInvestor() {
    const cost = 100 * (2 ** state.investors);
    if (state.money < cost) {
      message('Need ' + fmt(cost));
      return;
    }

    const moneyBeforeReset = state.money - cost;
    state.investors += 1;
    state.totalInvestorsEver += 1;
    state.investorMultiplier *= 2;
    playTone(660, 0.12, 'triangle');
    resetRun();
    state.money = moneyBeforeReset * state.investorMultiplier;
    save();
    render();
  }

  function evolve() {
    if (state.investors < getEvolutionRequirement()) {
      message('Need ' + getEvolutionRequirement() + ' investors');
      return;
    }

    state.evolution += 1;
    state.totalEvolvesEver += 1;
    state.evolveMultiplier *= 50;
    playTone(880, 0.14, 'square');
    resetRun();
    state.evolution = Math.max(1, state.evolution);
    state.money = 1 * state.evolveMultiplier;
    state.investorMultiplier = 1;
    save();
    render();
  }

  function prestige() {
    if (state.money < state.prestigeCost) {
      message('Need ' + fmt(state.prestigeCost));
      return;
    }

    state.money -= state.prestigeCost;
    state.prestige += 1;
    state.totalPrestigesEver += 1;
    state.prestigeCost = Math.min(MAX, Math.ceil(state.prestigeCost * 1.6));
    resetRun();
    state.prestige = Math.max(0, state.prestige);
    playTone(1040, 0.16, 'sawtooth');
    save();
    render();
  }

  function handleReset() {
    if (confirm('Reset save?')) {
      try {
        if (window.localStorage) localStorage.removeItem(SAVE_KEY);
      } catch (err) {
        console.warn('Reset failed:', err);
      }

      resetRun();
      state.evolution = 1;
      state.prestige = 0;
      state.prestigeCost = 1000000;
      state.clicks = 0;
      state.totalEarned = 0;
      state.collectibles = 0;
      state.achievements = {};
      state.quests = {};
      state.juice = 0;
      state.investorMultiplier = 1;
      state.evolveMultiplier = 1;
      state.totalInvestorsEver = 0;
      state.totalEvolvesEver = 0;
      state.totalPrestigesEver = 0;
      state.investors = 0;
      updateJuiceMultiplier();
      save();
      render();
    }
  }

  function registerEvents() {
    const clickerBtn = document.getElementById('clicker');
    if (clickerBtn) {
      clickerBtn.onclick = function(e) {
        const now = Date.now();
        if (now - state.lastClick < state.cooldown) return;

        state.lastClick = now;
        state.clicks += 1;

        const comboWindow = 1400;
        if (now - state.lastComboAt < comboWindow) state.combo += 1;
        else state.combo = 1;
        state.lastComboAt = now;

        const gain = state.perClick * state.combo * getCurrentEventMultiplier() * state.juiceMultiplier * (1 + state.prestige * 0.2);
        state.money += gain;
        state.totalEarned += gain;
        ghostText('+' + fmt(gain), e.clientX, e.clientY);
        playTone(520 + state.combo * 20, 0.08, 'triangle');
        save();
        render();
      };
    }

    const investorBtn = document.getElementById('investorBtn');
    if (investorBtn) investorBtn.onclick = buyInvestor;

    const evolutionBtn = document.getElementById('evolutionBtn');
    if (evolutionBtn) evolutionBtn.onclick = evolve;

    const prestigeBtn = document.getElementById('prestigeBtn');
    if (prestigeBtn) prestigeBtn.onclick = prestige;

    const upgradesBtn = document.getElementById('upgradesBtn');
    if (upgradesBtn) {
      upgradesBtn.onclick = function() {
        const s = document.getElementById('upgradesScreen');
        if (s) s.classList.add('open');
        renderGlobalUpgrades();
        renderManagerUpgrades();
        renderBuildingUpgradeList();
      };
    }

    const closeUpgrades = document.getElementById('closeUpgrades');
    if (closeUpgrades) {
      closeUpgrades.onclick = function() {
        const s = document.getElementById('upgradesScreen');
        if (s) s.classList.remove('open');
      };
    }

    const muteBtn = document.getElementById('muteBtn');
    if (muteBtn) {
      muteBtn.onclick = function() {
        state.muted = !state.muted;
        save();
        render();
      };
    }

    const saveBtn = document.getElementById('saveBtn');
    if (saveBtn) saveBtn.onclick = save;

    const resetBtn = document.getElementById('resetBtn');
    if (resetBtn) resetBtn.onclick = handleReset;
  }

  function initGame() {
    load();
    normalizeState();
    syncBuildingData();

    if (!Object.keys(state.owned).length) state.owned.stand = true;
    if (!state.buildingStats || Object.keys(state.buildingStats).length === 0) persistBuildings();
    if (!state.offlineMultiplier) state.offlineMultiplier = 1;
    if (state.juice === undefined) state.juice = 0;
    if (state.juiceMultiplier === undefined) state.juiceMultiplier = 1;
    if (state.investorMultiplier === undefined) state.investorMultiplier = 1;
    if (state.evolveMultiplier === undefined) state.evolveMultiplier = 1;
    if (state.totalInvestorsEver === undefined) state.totalInvestorsEver = 0;
    if (state.totalEvolvesEver === undefined) state.totalEvolvesEver = 0;
    if (state.totalPrestigesEver === undefined) state.totalPrestigesEver = 0;

    updateJuiceMultiplier();
    registerEvents();
    applyOfflineEarnings();
    render();
    setInterval(tick, 1000);
    setInterval(() => setEvent(), 15000);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initGame);
  } else {
    initGame();
  }
  </script>
</body>
</html>
