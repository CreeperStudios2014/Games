<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lemon Clicker (Photoreal) — Single File</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
  /* Improved embedded CSS: cleaner layout, better spacing, loading states */
  :root{
    --accent:#f6b93b;
    --bg:#081218;
    --card:#0f1720;
    --muted:rgba(230,238,246,0.7);
    --glass: rgba(255,255,255,0.04);
    --surface: rgba(255,255,255,0.02);
  }
  *{box-sizing:border-box}
  html,body,#game{height:100%;}
  body{
    margin:0;font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
    background:linear-gradient(180deg,#06121a 0%, #08313c 100%);
    color:var(--muted); -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  }

  /* App shell */
  #game{display:flex;flex-direction:column;min-height:100vh}
  header{display:flex;align-items:center;justify-content:space-between;padding:18px 28px}
  header h1{margin:0;font-size:20px;color:#fff;font-weight:700}
  .controls{display:flex;gap:10px}
  .controls button{padding:8px 12px;border-radius:10px;border:none;background:var(--glass);color:var(--muted);cursor:pointer}
  .controls .accent{background:linear-gradient(90deg,var(--accent),#ffd676);color:#072022;font-weight:600}

  main{display:grid;grid-template-columns:1fr 360px;gap:20px;padding:18px}
  @media(max-width:980px){main{grid-template-columns:1fr;align-items:start}}

  /* Play area */
  #play-area{position:relative;display:flex;align-items:center;justify-content:center;padding:24px}
  #background-layer{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.25),rgba(0,0,0,0.45));filter:blur(6px);opacity:0.9;z-index:0}

  #lemon-card{position:relative;width:min(680px,92%);height:min(520px,62vh);border-radius:18px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,0.6);z-index:1;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01))}
  #lemon-card img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.02);filter:brightness(0.98);}

  /* overlay on top of the image */
  #lemonOverlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;z-index:3;pointer-events:auto}
  #clicker{font-size:46px;padding:22px;border-radius:999px;border:none;background:linear-gradient(180deg,#ffffff,#fff7e6);cursor:pointer;box-shadow:0 12px 30px rgba(2,8,23,0.6);width:110px;height:110px;display:flex;align-items:center;justify-content:center}
  #perClick{margin-top:6px;font-weight:700;color:var(--bg);background:linear-gradient(90deg,var(--accent),#ffd27a);padding:6px 12px;border-radius:12px}

  /* loading state */
  .loading::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(0,0,0,0.15));backdrop-filter:blur(2px);}

  /* Sidebar */
  #sidebar{display:flex;flex-direction:column;gap:12px}
  .stat{background:var(--surface);padding:12px;border-radius:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
  .stat strong{color:#fff}

  .panel{background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));padding:12px;border-radius:12px}
  .panel h3{margin:0 0 8px 0;color:#fff}
  #shop .item,#investors .inv{display:flex;justify-content:space-between;padding:8px;margin-bottom:8px;border-radius:8px;background:rgba(0,0,0,0.15);align-items:center}
  .muted{font-size:12px;color:var(--muted)}
  button.buy,button.inv-btn{background:var(--accent);border:none;padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:600}

  /* footer */
  footer{padding:12px;text-align:center;font-size:13px;opacity:0.9}

  /* small helpers */
  .center{display:flex;align-items:center;gap:8px}
  </style>
</head>
<body>
  <div id="game">
    <header>
      <h1>Lemon Clicker</h1>
      <div class="controls">
        <button id="muteBtn" aria-label="Mute audio">🔊</button>
        <button id="ascendBtn" class="accent">Ascend</button>
      </div>
    </header>

    <main>
      <section id="play-area">
        <div id="background-layer"></div>
        <div id="lemon-card" class="loading">
          <img id="lemonImg" alt="Photorealistic lemon">
          <div id="lemonOverlay">
            <button id="clicker" aria-label="Click the lemon">🍋</button>
            <div id="perClick">+0</div>
            <div class="muted">Click the lemon to squeeze and earn lemons</div>
          </div>
        </div>
      </section>

      <aside id="sidebar">
        <div class="stat"><div>Lemons</div><strong id="lemons">0</strong></div>
        <div class="stat"><div>Lemons / sec</div><strong id="lps">0</strong></div>
        <div class="stat"><div>Evolution</div><strong id="evolution">1</strong></div>
        <div class="stat"><div>Prestige</div><strong id="prestige">0</strong></div>

        <div class="panel">
          <h3>Shop</h3>
          <div id="shop"></div>
        </div>

        <div class="panel">
          <h3>Investors</h3>
          <div id="investors"></div>
        </div>

        <div class="panel small">
          <h4>Save / Load</h4>
          <div style="display:flex;gap:8px;margin-top:8px">
            <button id="saveBtn">Save Now</button>
            <button id="resetBtn">Reset</button>
          </div>
        </div>

        <div class="panel credits">
          <small>Images: Unsplash (loaded at runtime) • Music: SoundHelix & SoundJay (runtime)</small>
        </div>
      </aside>
    </main>

    <footer>
      <small style="color:var(--muted)">Photoreal Lemon Clicker — Evolution • Investors • Ascensions</small>
    </footer>
  </div>

  <script>
  // Improved single-file JS with robust event attachment and debug-safe behavior
  (function(){
    const STORAGE_KEY = 'lemon_clicker_v1';

    const CONFIG = {
      shop: [
        { id: 'click_upgrade', name: 'Better Squeeze', baseCost: 15, type: 'click', power: 1 },
        { id: 'juicer', name: 'Juicer (passive)', baseCost: 60, type: 'generator', power: 1 }
      ],
      investors: [
        { id: 'angel', name: 'Angel Investor', baseCost: 500, multiplier: 1.5, duration: 0, permanent: true },
        { id: 'vc', name: 'Venture Capital', baseCost: 2000, multiplier: 2.5, duration: 60000, permanent: false }
      ],
      evolution: { baseRequirement: 1000, multiplier: 10 },
      ascension: { prestigePerAscend: 1 }
    };

    const qs = s => document.querySelector(s);
    const qid = id => document.getElementById(id);

    let state = {
      lemons: 0,
      lps: 0,
      perClick: 1,
      evolution: 1,
      prestige: 0,
      shop: {},
      investors: {},
      lastTick: Date.now(),
      audioMuted: false
    };

    let assets = {
      bgMusic: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3',
      clickSfx: 'https://www.soundjay.com/button/sounds/button-16.mp3',
      buySfx: 'https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3'
    };

    function save(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){console.warn('Save failed',e)} }
    function load(){ try{ const raw = localStorage.getItem(STORAGE_KEY); if(raw){ const parsed = JSON.parse(raw); state = Object.assign(state, parsed); } }catch(e){console.warn('Load failed',e)} }
    function format(n){ return Math.floor(n).toLocaleString(); }

    function uiUpdate(){
      qid('lemons').textContent = format(Number(state.lemons) || 0);
      qid('lps').textContent = (Number(state.lps) || 0).toFixed(1);
      qid('perClick').textContent = `+${Math.floor(Number(state.perClick) || 0)}`;
      qid('evolution').textContent = state.evolution;
      qid('prestige').textContent = state.prestige;
    }

    function buildShop(){
      const shopEl = qid('shop'); shopEl.innerHTML = '';
      CONFIG.shop.forEach(item =>{
        const owned = Number(state.shop[item.id]||0);
        const cost = Math.max(1, Math.ceil(item.baseCost * Math.pow(1.15, owned)));
        const div = document.createElement('div'); div.className='item';
        div.innerHTML = `<div style="min-width:140px"><strong style='color:#fff'>${item.name}</strong><div class="muted">Owned: ${owned}</div></div><div style='text-align:right'><div style='margin-bottom:8px'>${cost}</div><button class="buy">Buy</button></div>`;
        div.querySelector('button').addEventListener('click', ()=>{
          if(Number(state.lemons) >= cost){
            state.lemons = Number(state.lemons) - cost; state.shop[item.id] = owned+1;
            if(item.type==='click') state.perClick = Number(state.perClick) + item.power;
            if(item.type==='generator') state.lps = Number(state.lps) + item.power;
            playSfx(assets.buySfx);
            buildShop(); uiUpdate(); save();
          } else flash(qid('lemons'));
        });
        shopEl.appendChild(div);
      })
    }

    function buildInvestors(){
      const invEl = qid('investors'); invEl.innerHTML = '';
      CONFIG.investors.forEach(inv=>{
        const owned = Number(state.investors[inv.id]||0);
        const cost = Math.max(1, Math.ceil(inv.baseCost * Math.pow(1.25, owned)));
        const div = document.createElement('div'); div.className='inv';
        div.innerHTML = `<div style="min-width:140px"><strong style='color:#fff'>${inv.name}</strong><div class="muted">Owned: ${owned}</div></div><div style='text-align:right'><div style='margin-bottom:8px'>${cost}</div><button class="inv-btn">Buy</button></div>`;
        div.querySelector('button').addEventListener('click', ()=>{
          if(Number(state.lemons) >= cost){
            state.lemons = Number(state.lemons) - cost; state.investors[inv.id] = owned+1;
            if(inv.permanent){ state.perClick = Number(state.perClick) * inv.multiplier; state.lps = Number(state.lps) * inv.multiplier; }
            else { applyTemporaryMultiplier(inv.multiplier, inv.duration); }
            playSfx(assets.buySfx);
            buildInvestors(); uiUpdate(); save();
          } else flash(qid('lemons'));
        });
        invEl.appendChild(div);
      })
    }

    function applyTemporaryMultiplier(mult, durationMs){
      state.perClick = Number(state.perClick) * mult; state.lps = Number(state.lps) * mult;
      setTimeout(()=>{ state.perClick = Number(state.perClick) / mult; state.lps = Number(state.lps) / mult; uiUpdate(); save(); }, Math.max(100, durationMs));
    }

    function tick(){
      const now = Date.now(); const dt = (now - state.lastTick)/1000; state.lastTick = now;
      state.lemons = Number(state.lemons) + (Number(state.lps) * dt);
      const evoReq = CONFIG.evolution.baseRequirement * Math.pow(CONFIG.evolution.multiplier, state.evolution-1);
      if(Number(state.lemons) >= evoReq){
        state.lemons = Number(state.lemons) - evoReq; state.evolution = Number(state.evolution) + 1;
        state.perClick = Number(state.perClick) * 1.5; state.lps = Number(state.lps) * 1.25;
        flash(qid('lemon-card'));
      }
      uiUpdate();
    }

    function startLoop(){ state.lastTick = Date.now(); setInterval(tick, 500); }

    function hookUI(){
      const clicker = qid('clicker');
      const lemonImg = qid('lemonImg');
      const overlay = qid('lemonOverlay');

      // Primary click target: button
      clicker.addEventListener('click', ()=>{ state.lemons = Number(state.lemons) + Number(state.perClick); uiUpdate(); playSfx(assets.clickSfx); save(); });
      // Also allow clicking the image/overlay to register a click (makes it more forgiving)
      [lemonImg, overlay].forEach(el=>{
        el.addEventListener('click', (e)=>{
          // if the button itself handled it, ignore double
          if(e.target === clicker) return;
          state.lemons = Number(state.lemons) + Number(state.perClick); uiUpdate(); playSfx(assets.clickSfx); save();
        });
      });

      qid('saveBtn').addEventListener('click', ()=>{ save(); pulse(qid('saveBtn')); });
      qid('resetBtn').addEventListener('click', ()=>{ if(confirm('Reset all progress?')){ localStorage.removeItem(STORAGE_KEY); location.reload(); }});
      qid('muteBtn').addEventListener('click', toggleMute);
      qid('ascendBtn').addEventListener('click', ()=>{ if(confirm('Ascend: reset progress for prestige?')) ascend(); });
    }

    function ascend(){
      const gained = Math.max(0, Math.floor((Number(state.evolution)-1) / 3));
      if(gained<=0){ alert('You need more evolutions to gain prestige'); return; }
      state.prestige = Number(state.prestige) + gained;
      const preserve = {prestige: state.prestige};
      state = Object.assign({lemons:0,lps:0,perClick:1,evolution:1,prestige:0,shop:{},investors:{},lastTick:Date.now(),audioMuted:false}, preserve);
      load(); playSfx(assets.buySfx); uiUpdate(); buildShop(); buildInvestors(); save();
    }

    function toggleMute(){ state.audioMuted = !state.audioMuted; if(state.audioMuted){ audio && audio.pause(); qid('muteBtn').textContent='🔇'; } else { audio && audio.play(); qid('muteBtn').textContent='🔊'; } save(); }

    function flash(el){ if(!el) return; el.animate([{transform:'scale(1)'},{transform:'scale(1.02)'},{transform:'scale(1)'}],{duration:340}); }
    function pulse(el){ if(!el) return; el.animate([{opacity:1},{opacity:0.6},{opacity:1}],{duration:400}); }

    let audio = null;
    function setupAudio(){ try{ audio = new Audio(assets.bgMusic); audio.loop = true; audio.volume = 0.15; if(!state.audioMuted) audio.play().catch(()=>{}); }catch(e){console.warn('Audio failed',e)} }
    function playSfx(url){ if(state.audioMuted) return; try{ const s = new Audio(url); s.volume=0.6; s.play().catch(()=>{});}catch(e){} }

    function removeLoading(){ const card = qid('lemon-card'); if(card) card.classList.remove('loading'); }

    async function init(){
      load();
      CONFIG.shop.forEach(it=>{ if(!(it.id in state.shop)) state.shop[it.id]=0 });
      CONFIG.investors.forEach(it=>{ if(!(it.id in state.investors)) state.investors[it.id]=0 });

      // load photoreal images at runtime (Unsplash random queries)
      const lemonQuery = 'lemon';
      const bgQuery = 'lemon wood table';
      const lemonUrl = `https://source.unsplash.com/1600x900/?${encodeURIComponent(lemonQuery)}`;
      const bgUrl = `https://source.unsplash.com/1600x900/?${encodeURIComponent(bgQuery)}`;

      const img = qid('lemonImg');
      img.onload = () => { removeLoading(); };
      img.onerror = () => { removeLoading(); img.style.objectFit = 'contain'; };
      img.src = lemonUrl;
      qid('background-layer').style.backgroundImage = `url('${bgUrl}')`;

      buildShop(); buildInvestors(); hookUI(); uiUpdate(); setupAudio(); startLoop();

      // safety: if elements didn't attach listeners, log
      setTimeout(()=>{
        if(!qid('clicker').onclick && !qid('clicker')._hasListener){ console.info('Click handler attached? yes (fallbacks added)'); }
      },500);
    }

    // wait for DOM fully parsed
    if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
  })();
  </script>
</body>
</html>
