<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lemon Clicker — Money Edition</title>
<style>
:root{--accent:#f6b93b;--bg:#081218;--muted:rgba(230,238,246,.9);--surface:rgba(255,255,255,.05)}*{box-sizing:border-box;font-family:Inter,system-ui,sans-serif}body{margin:0;background:var(--bg);color:var(--muted)}#game{max-width:1100px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1{font-size:20px;margin:0}button{border:0;border-radius:8px;padding:8px 10px;background:var(--accent);color:#081218;font-weight:700;cursor:pointer}.controls button{margin-left:8px}.controls #muteBtn{background:var(--surface);color:var(--muted)}main{display:flex;gap:18px;align-items:flex-start}#timers-panel{width:220px}#play-area{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}#sidebar{width:260px}.stat{display:flex;justify-content:space-between;padding:6px 0}.panel{background:var(--surface);padding:14px;border-radius:10px;margin-top:12px}.progress-panel{display:grid;gap:8px}.progress-panel button{width:100%}#lemon-card{width:min(100%,480px);height:260px;background:var(--surface);border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative}#lemonImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:12px;opacity:.08}#lemonOverlay{position:relative;text-align:center;z-index:1}#clicker{font-size:40px;padding:18px;border-radius:999px;background:var(--accent);color:#081218}.small{font-size:12px;color:rgba(230,238,246,.72)}#shop{width:min(100%,480px);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:16px}.shop-row,.upgrade-row,.building-option{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;background:var(--surface);border-radius:8px}.description{flex:1}.disabled{opacity:.55;pointer-events:none}#timersList>div{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08)}.timer-row{display:flex;flex-direction:column;gap:7px}.collectBtn{width:100%}.screen{position:fixed;inset:0;z-index:10;display:none;overflow:auto;background:var(--bg);padding:28px}.screen.open{display:block}.screen-header,.screen-content{max-width:900px;margin:auto}.screen-header{display:flex;justify-content:space-between;align-items:center}.screen-content{margin-top:18px}.upgrade-grid,.building-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.upgrade-grid .upgrade-row,.building-option{align-items:stretch;flex-direction:column}.upgrade-grid button,.building-option button{width:100%}.money-banner{display:flex;justify-content:space-between;padding:12px 14px;margin-bottom:18px;background:var(--surface);border-radius:10px;font-size:18px}.owned{color:#8ee38e;font-weight:700}@media(max-width:900px){main{flex-wrap:wrap}#timers-panel,#sidebar,#play-area{width:100%}}@media(max-width:600px){#shop{grid-template-columns:1fr}.upgrade-grid,.building-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:380px){.upgrade-grid,.building-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="game"><header><h1 id="gameTitle">Lemon Clicker — Money</h1><div class="controls"><button id="upgradesBtn">Upgrades</button><button id="muteBtn">🔊</button></div></header><main><aside id="timers-panel"><h3>Building Timers</h3><div id="timersList"></div></aside><section id="play-area"><div id="lemon-card"><img id="lemonImg" alt="Fruit"><div id="lemonOverlay"><button id="clicker">🍋</button><div id="perClick">+$1</div><div class="small">Click to earn money.</div></div></div><div id="shop"></div></section><aside id="sidebar"><div class="stat"><span>Money</span><strong id="money">$0</strong></div><div class="stat"><span>Money / sec</span><strong id="mps">0/s</strong></div><div class="stat"><span>Evolution</span><strong id="evolution">1</strong></div><div class="stat"><span>Prestige</span><strong id="prestige">0</strong></div><div class="stat"><span>Investors</span><strong id="investors">0</strong></div><div class="panel progress-panel"><button id="investorBtn">Buy Investor</button><button id="evolutionBtn">Evolve</button><button id="prestigeBtn">Prestige</button><button id="saveBtn">Save</button><button id="resetBtn">Reset</button><div id="progressMessage" class="small"></div></div></aside></main><footer>Base click cooldown: <span id="clickCooldownDisplay">250</span> ms</footer></div>
<div id="upgradesScreen" class="screen"><div class="screen-header"><h2>Upgrades</h2><button id="closeUpgrades">Close</button></div><div class="screen-content"><div class="money-banner"><span>Current money</span><strong id="upgradeMoney">$0</strong></div><h3>Global upgrades</h3><div id="globalUpgradeGrid" class="upgrade-grid"></div><h3>Managers</h3><div id="managerGrid" class="upgrade-grid"></div><h3>Building upgrades</h3><div id="buildingGrid" class="building-grid"></div></div></div>
<div id="buildingScreen" class="screen"><div class="screen-header"><h2 id="buildingScreenTitle">Building Upgrades</h2><button id="closeBuildingScreen">Back</button></div><div class="screen-content"><div class="money-banner"><span>Current money</span><strong id="buildingMoney">$0</strong></div><div id="buildingUpgradeGrid" class="upgrade-grid"></div></div></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),SAVE_KEY='lemon_money_v2',MAX=8.8e67,BASE_BUILDING_COST=250;
const definitions=[['stand','Lemon Stand',1,5,1],['dash','Lemon Dash',4,4,4],['depot','Lemon Depot',16,12,16],['trading','Lemon Trading',64,10,64],['labs','Lemon Labs',256,8,256],['robotics','Lemon Robotics',1024,6,1024],['republic','Lemon Republic',4096,14,4096],['lemonx','LemonX',16384,20,16384]];
const fruits=[['Lemon','#f6b93b','🍋'],['Orange','#f28c28','🍊'],['Lime','#a5f57a','🍈'],['Grapefruit','#ff8fa3','🍊'],['Sour???','#4caf50','🍏']];
const effects=['Power ×3','Interval ×0.8','Power ×4','Power ×4','Power ×4','Interval ×0.8','Power ×2','Interval ×0.8','Power ×2','Power ×3'];
const state={money:1,perClick:1,cooldown:250,lastClick:0,owned:{},managers:{},investors:0,evolution:1,prestige:0,prestigeCost:1e6,progress:{},lastCollect:{},upgrades:{},buildingStats:{},muted:false,lastTick:Date.now()};
let buildings=[],openBuilding=null;
const money=n=>!Number.isFinite(n)?'$∞':n<1e6?'$'+Math.floor(n).toLocaleString():'$'+n.toExponential(2);
const cashMultiplier=()=>2**state.investors*20**state.prestige;
const intervalMultiplier=()=>50**Math.max(0,state.evolution-1)*20**state.prestige;
function buildingCost(index){let cost=BASE_BUILDING_COST;for(let i=1;i<=index;i++)cost=Math.min(MAX,Math.round(cost*cost));return cost}
function upgradeCost(id,index){const buildingIndex=definitions.findIndex(definition=>definition[0]===id);return Math.min(MAX,Math.ceil(buildingCost(buildingIndex)*1.7**(index+1)))}
function save(){localStorage.setItem(SAVE_KEY,JSON.stringify(state))}
function load(){try{Object.assign(state,JSON.parse(localStorage.getItem(SAVE_KEY)||'{}'))}catch(error){}}
function rebuildBuildings(){buildings=definitions.map((definition,index)=>({id:definition[0],name:definition[1],cost:buildingCost(index),power:definition[2],interval:definition[3]}));for(const building of buildings){const saved=state.buildingStats[building.id];if(saved){building.power=saved.power;building.interval=saved.interval}}}
function saveBuildingStats(){state.buildingStats={};for(const building of buildings)state.buildingStats[building.id]={power:building.power,interval:building.interval}}
function resetRun(){state.money=1;state.perClick=1;state.cooldown=250;state.lastClick=0;state.owned={};state.managers={};state.progress={};state.lastCollect={};state.upgrades={};state.buildingStats={};state.lastTick=Date.now();rebuildBuildings();state.owned.stand=true}
function evolutionRequirement(){let result=10;for(let i=1;i<state.evolution;i++)result=Math.ceil(result*1.5);return result}
function fruitName(){const index=(state.evolution-1)%fruits.length;return fruits[index][0]+(state.evolution>fruits.length?' +'+Math.floor((state.evolution-1)/fruits.length):'')}
function theme(){const fruit=fruits[(state.evolution-1)%fruits.length];document.documentElement.style.setProperty('--accent',fruit[1]);$('gameTitle').textContent=fruitName()+' Clicker — Money';$('clicker').textContent=fruit[2]}
function message(text){$('progressMessage').textContent=text;setTimeout(()=>{$('progressMessage').textContent=''},2500)}
function addUpgrade(container,name,description,cost,id,action,kind='upgrade'){const owned=kind==='manager'?state.managers[id]:state.upgrades[id],row=document.createElement('div');row.className='upgrade-row';row.innerHTML='<div class="description"><b>'+name+'</b><div class="small">'+description+'</div>'+(owned?'<div class="owned">Owned</div>':'')+'</div>';const button=document.createElement('button');button.textContent=owned?'Owned':money(cost);if(owned)button.className='disabled';else button.onclick=()=>{if(state.money<cost)return;state.money-=cost;if(kind==='manager')state.managers[id]=1;else state.upgrades[id]=true;action();saveBuildingStats();save();render()};row.append(button);container.append(row)}
function renderBuildingUpgrades(id){openBuilding=id;const building=buildings.find(item=>item.id===id),grid=$('buildingUpgradeGrid');$('buildingScreenTitle').textContent=building.name+' Upgrades';$('buildingMoney').textContent=money(state.money);grid.innerHTML='';effects.forEach((effect,index)=>addUpgrade(grid,'Upgrade '+(index+1),effect,upgradeCost(id,index),'building_'+id+'_'+index,()=>{const amount=Number(effect.match(/\d+(?:\.\d+)?/)[0]);if(effect.includes('Power ×'))building.power*=amount;else if(effect.includes('Power +'))building.power+=amount;else building.interval*=amount}))}
function renderUpgrades(){$('upgradeMoney').textContent=money(state.money);const globals=$('globalUpgradeGrid');globals.innerHTML='';addUpgrade(globals,'Click Power','Click power +1000',1200000,'click_power',()=>state.perClick+=1000);addUpgrade(globals,'Click Speed','Click cooldown ×0.005',2000000,'click_speed',()=>state.cooldown=Math.max(30,Math.floor(state.cooldown*.005)));const managers=$('managerGrid');managers.innerHTML='';buildings.forEach(building=>addUpgrade(managers,building.name+' Manager','Automates '+building.name,building.cost,building.id,()=>state.managers[building.id]=1,'manager'));const grid=$('buildingGrid');grid.innerHTML='';buildings.forEach(building=>{const option=document.createElement('div');option.className='building-option';option.innerHTML='<b>'+building.name+'</b><div class="small">View 10 upgrades</div><button>Open</button>';option.onclick=()=>{$('upgradesScreen').classList.remove('open');renderBuildingUpgrades(building.id);$('buildingScreen').classList.add('open')};grid.append(option)})}
function renderShop(){const shop=$('shop');shop.innerHTML='';buildings.forEach(building=>{const row=document.createElement('div');row.className='shop-row';row.innerHTML='<div><b>'+building.name+'</b><div class="small">'+(state.owned[building.id]?'Owned':'One-time purchase')+' · '+building.power+'/cycle every '+building.interval+'s</div></div>';const button=document.createElement('button');button.textContent=state.owned[building.id]?'Owned':money(building.cost);if(state.owned[building.id])button.className='disabled';else button.onclick=()=>{if(state.money<building.cost)return;state.money-=building.cost;state.owned[building.id]=true;state.progress[building.id]=0;save();render()};row.append(button);shop.append(row)})}
function collect(id){const building=buildings.find(item=>item.id===id),progress=state.progress[id]||0;if(!building||!state.owned[id]||state.managers[id]||progress<building.interval)return;const cycles=Math.floor(progress/building.interval);state.money+=cycles*building.power*cashMultiplier();state.progress[id]=progress%building.interval;state.lastCollect[id]=Date.now();save();render()}
function buyInvestor(){const cost=100*2**state.investors;if(state.money<cost)return message('Need '+money(cost)+' for an investor.');resetRun();state.investors++;save();render()}
function evolve(){const required=evolutionRequirement();if(state.investors<required)return message('Need '+required+' investors to evolve.');resetRun();state.investors=0;state.evolution++;save();render()}
function prestige(){const cost=state.prestigeCost;if(state.money<cost)return message('Need '+money(cost)+' to prestige.');resetRun();state.investors=0;state.evolution=1;state.prestige++;state.prestigeCost=Math.min(MAX,Math.ceil(cost**1.5));save();render()}
function render(){ $('money').textContent=money(state.money);$('mps').textContent=Math.floor(buildings.reduce((sum,b)=>sum+(state.owned[b.id]&&state.managers[b.id]?b.power/(b.interval/intervalMultiplier()):0),0)*cashMultiplier())+'/s';$('perClick').textContent='+$'+state.perClick;$('clickCooldownDisplay').textContent=state.cooldown;$('muteBtn').textContent=state.muted?'🔇':'🔊';$('evolution').textContent=fruitName();$('prestige').textContent=state.prestige;$('investors').textContent=state.investors;$('investorBtn').textContent='Buy Investor ('+money(100*2**state.investors)+')';$('evolutionBtn').textContent='Evolve ('+evolutionRequirement()+' investors)';$('prestigeBtn').textContent='Prestige ('+money(state.prestigeCost)+')';renderShop();renderUpgrades();if(openBuilding)renderBuildingUpgrades(openBuilding);const timers=$('timersList');timers.innerHTML='';buildings.forEach(building=>{if(!state.owned[building.id])return;const progress=state.progress[building.id]||0;timers.innerHTML+='<div class="timer-row"><b>'+building.name+'</b><span class="small">'+(state.managers[building.id]?'Automated':'Progress: '+Math.floor(progress)+'/'+building.interval+'s')+'</span>'+(state.managers[building.id]?'':'<button class="collectBtn" data-id="'+building.id+'">Collect</button>')+'</div>'});if(!timers.innerHTML)timers.textContent='Own a building to see its timer here.';timers.querySelectorAll('[data-id]').forEach(button=>button.onclick=()=>collect(button.dataset.id));theme()}
function tick(){const now=Date.now(),delta=(now-state.lastTick)/1000;state.lastTick=now;buildings.forEach(building=>{if(!state.owned[building.id])return;const interval=building.interval/intervalMultiplier();state.progress[building.id]=(state.progress[building.id]||0)+delta;if(state.managers[building.id]){const cycles=Math.floor(state.progress[building.id]/interval);if(cycles){state.money+=cycles*building.power*cashMultiplier();state.progress[building.id]%=interval}}});render()}
load();rebuildBuildings();for(const building of buildings){state.owned[building.id]??=false;state.progress[building.id]??=0;state.lastCollect[building.id]??=0}state.investors??=0;state.evolution??=1;state.prestige??=0;state.prestigeCost??=1e6;if(!Object.values(state.owned).some(Boolean))state.owned.stand=true;
$('clicker').onclick=()=>{const now=Date.now();if(now-state.lastClick>=state.cooldown){state.lastClick=now;state.money+=state.perClick*cashMultiplier();save();render()}};$('investorBtn').onclick=buyInvestor;$('evolutionBtn').onclick=evolve;$('prestigeBtn').onclick=prestige;$('upgradesBtn').onclick=()=>{$('upgradesScreen').classList.add('open');renderUpgrades()};$('closeUpgrades').onclick=()=>$('upgradesScreen').classList.remove('open');$('closeBuildingScreen').onclick=()=>{$('buildingScreen').classList.remove('open');$('upgradesScreen').classList.add('open')};$('saveBtn').onclick=save;$('resetBtn').onclick=()=>{if(confirm('Reset save?')){localStorage.removeItem(SAVE_KEY);location.reload()}};$('muteBtn').onclick=()=>{state.muted=!state.muted;save();render()};$('lemonImg').src='https://source.unsplash.com/1600x900/?fruit';render();setInterval(tick,1000)
})();
</script>
</body>
</html>
