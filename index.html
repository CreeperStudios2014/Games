<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lemon Clicker — Money Edition</title>
<style>
:root{--bg:#081218;--panel:#ffffff0d;--text:#edf6ff;--muted:#b9c8d6;--accent:#f6b93b;--good:#8ee38e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}button{border:0;border-radius:8px;padding:9px 12px;background:var(--accent);color:#081218;font-weight:700;cursor:pointer}button:disabled,.owned-button{background:#59636b;color:#cbd3d9;cursor:not-allowed;opacity:.75}.app{max-width:1200px;margin:auto;padding:18px}.top,.row,.stat,.money{display:flex;align-items:center;justify-content:space-between;gap:10px}.top{margin-bottom:18px}.top h1{font-size:21px;margin:0}.layout{display:grid;grid-template-columns:220px 1fr 280px;gap:18px}.panel,.card,.row,.money{background:var(--panel);border-radius:11px;padding:12px}.panel{margin-bottom:12px}.lemon{height:260px;display:grid;place-items:center;position:relative;overflow:hidden}.lemon img{position:absolute;width:100%;height:100%;object-fit:cover;opacity:.13}.lemon-inner{position:relative;text-align:center}.clicker{font-size:44px;border-radius:50%;width:110px;height:110px}.shop,.grid{display:grid;gap:8px;margin-top:14px}.shop{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.info{flex:1}.small{font-size:12px;color:var(--muted)}.stat{padding:8px 0;border-bottom:1px solid #ffffff14}.progress{height:8px;background:#ffffff18;border-radius:99px;overflow:hidden;margin:7px 0}.progress span{display:block;height:100%;background:var(--accent)}.screen{display:none;position:fixed;inset:0;z-index:10;background:var(--bg);overflow:auto;padding:26px}.screen.open{display:block}.screen-head,.screen-content{max-width:980px;margin:auto}.screen-head{display:flex;justify-content:space-between;align-items:center}.screen-content{margin-top:18px}.float{position:fixed;z-index:20;color:var(--accent);font-weight:800;pointer-events:none;animation:float 1s forwards}@keyframes float{to{opacity:0;transform:translateY(-60px)}}@media(max-width:900px){.layout{grid-template-columns:1fr}.shop{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app"><header class="top"><h1 id="title">Lemon Clicker — Money</h1><div><button id="upgradesBtn">Upgrades</button><button id="muteBtn">🔊</button></div></header><div class="layout"><aside><div class="panel"><h3>Building Timers</h3><div id="timers"></div></div><div class="panel"><h3>Quests</h3><div id="quests"></div></div></aside><main><div class="card lemon"><img id="fruitImage" alt="fruit"><div class="lemon-inner"><button id="clicker" class="clicker">🍋</button><div id="perClick">+$1</div><div id="combo">Combo ×1</div></div></div><div id="shop" class="shop"></div><div class="card"><div id="eventText" class="small">No event active</div><div class="progress"><span id="eventBar"></span></div></div></main><aside><div class="stat"><span>Money</span><b id="money">$0</b></div><div class="stat"><span>Money/sec</span><b id="mps">0/s</b></div><div class="stat"><span>Evolution</span><b id="evolution">1</b></div><div class="stat"><span>Prestige</span><b id="prestige">0</b></div><div class="stat"><span>Investors</span><b id="investors">0</b></div><div class="panel"><button id="investorBtn">Buy Investor</button><button id="evolutionBtn">Evolve</button><button id="prestigeBtn" style="width:100%;margin-top:8px">Prestige</button><button id="saveBtn" style="width:100%;margin-top:8px">Save</button><button id="resetBtn" style="width:100%;margin-top:8px">Reset</button><div id="message" class="small"></div></div><div class="panel"><h3>Achievements</h3><div id="achievements"></div></div></aside></div></div>
<div id="upgradesScreen" class="screen"><div class="screen-head"><h2>Upgrades</h2><button id="closeUpgrades">Close</button></div><div class="screen-content"><div class="money"><span>Current money</span><b id="upgradeMoney">$0</b></div><h3>Global Upgrades</h3><div id="globalGrid" class="grid"></div><h3>Managers</h3><div id="managerGrid" class="grid"></div><h3>Building Upgrades</h3><div id="buildingGrid" class="grid"></div></div></div>
<div id="buildingScreen" class="screen"><div class="screen-head"><h2 id="buildingTitle">Building Upgrades</h2><button id="backToUpgrades">Back to Upgrades</button></div><div class="screen-content"><div class="money"><span>Current money</span><b id="buildingMoney">$0</b></div><div id="buildingUpgradeGrid" class="grid"></div></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),KEY='lemon_money_v2',MAX=8.8e67,BASE=250;
const fruits=[['Lemon','#f6b93b','🍋'],['Orange','#f28c28','🍊'],['Lime','#a5f57a','🍈'],['Grapefruit','#ff8fa3','🍊'],['Sour???','#4caf50','🍏']];
const defs=[['stand','Lemon Stand',1,5],['dash','Lemon Dash',4,4],['depot','Lemon Depot',16,12],['trading','Lemon Trading',64,10],['labs','Lemon Labs',256,8],['robotics','Lemon Robotics',1024,6],['republic','Lemon Republic',4096,14],['lemonx','LemonX',16384,20]];
const effects=['Power ×2','Interval ×0.8','Power ×3','Power +20','Interval ×0.75','Power ×4','Power +50','Interval ×0.7','Power ×2','Interval ×0.6'];
const state={money:1,perClick:1,cooldown:250,lastClick:0,owned:{},managers:{},progress:{},upgrades:{},buildingStats:{},investors:0,evolution:1,prestige:0,prestigeCost:1e6,lastSavedAt:Date.now(),lastTick:Date.now(),combo:1,lastComboAt:0,clicks:0,totalEarned:0,collectibles:0,achievements:{},quests:{},event:null,eventEndsAt:0,offlineMultiplier:1,muted:false};let buildings=[];
const fmt=n=>!Number.isFinite(n)?'$∞':n<1e6?'$'+Math.floor(n).toLocaleString():'$'+n.toExponential(2),fruit=()=>fruits[(state.evolution-1)%fruits.length],cash=()=>2**state.investors*20**state.prestige*(state.event?.multiplier||1),speed=()=>50**Math.max(0,state.evolution-1)*20**state.prestige;
function cost(i){let n=BASE;for(let x=1;x<=i;x++)n=Math.min(MAX,Math.round(n*n));return n}function upgradeCost(id,i){return Math.min(MAX,Math.ceil(cost(defs.findIndex(d=>d[0]===id))*1.7**(i+1)))}
function save(){state.lastSavedAt=Date.now();localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{Object.assign(state,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}}
function rebuild(){buildings=defs.map((d,i)=>{let saved=state.buildingStats[d[0]]||{};return{id:d[0],name:d[1],power:saved.power??d[2],interval:saved.interval??d[3],upgrades:saved.upgrades||{},cost:cost(i)}})}function persist(){state.buildingStats={};buildings.forEach(b=>state.buildingStats[b.id]={power:b.power,interval:b.interval,upgrades:b.upgrades})}
function req(){let n=10;for(let i=1;i<state.evolution;i++)n=Math.ceil(n*1.5);return n}function msg(text){$('message').textContent=text;clearTimeout(msg.timer);msg.timer=setTimeout(()=>$('message').textContent='',2400)}
function resetRun(){state.money=1;state.perClick=1;state.cooldown=250;state.lastClick=0;state.owned={};state.managers={};state.progress={};state.upgrades={};state.buildingStats={};state.combo=1;state.lastComboAt=0;state.clicks=0;state.totalEarned=0;state.event=null;state.eventEndsAt=0;rebuild();state.owned.stand=true;state.lastTick=Date.now()}
function row(container,name,desc,price,owned,action){let r=document.createElement('div');r.className='row';r.innerHTML='<div class="info"><b>'+name+'</b><div class="small">'+desc+'</div>'+(owned?'<div class="owned">Owned</div>':'')+'</div>';let b=document.createElement('button');b.textContent=owned?'Owned':fmt(price);b.disabled=owned;if(!owned)b.onclick=action;r.append(b);container.append(r)}
function renderGlobal(){let g=$('globalGrid');g.innerHTML='';[['click_power','Click Power','+$1000 per click',1200000,()=>state.perClick+=1000],['click_speed','Click Speed','Cooldown ×0.7',2000000,()=>state.cooldown=Math.max(30,state.cooldown*.7)],['offline','Offline Boost','+25% offline earnings',5000000,()=>state.offlineMultiplier*=1.25]].forEach(([id,n,d,p,a])=>row(g,n,d,p,!!state.upgrades[id],()=>{if(state.money<p)return;state.money-=p;state.upgrades[id]=1;a();save();render()}))}
function renderManagers(){let g=$('managerGrid');g.innerHTML='';buildings.forEach(b=>row(g,b.name+' Manager','Automates '+b.name,b.cost,!!state.managers[b.id],()=>{if(state.money<b.cost)return;state.money-=b.cost;state.managers[b.id]=1;save();render()}))}
function renderBuildingList(){let g=$('buildingGrid');g.innerHTML='';buildings.forEach(b=>{let r=document.createElement('div');r.className='row';r.innerHTML='<div class="info"><b>'+b.name+'</b><div class="small">10 building-specific upgrades</div></div>';let button=document.createElement('button');button.textContent='Open';button.onclick=()=>openBuildingScreen(b.id);r.append(button);g.append(r)})}
function openBuildingScreen(id){$('upgradesScreen').classList.remove('open');$('buildingScreen').classList.add('open');renderBuildingScreen(id)}
function renderBuildingScreen(id){let b=buildings.find(x=>x.id===id);if(!b)return;$('buildingTitle').textContent=b.name+' Upgrades';$('buildingMoney').textContent=fmt(state.money);let g=$('buildingUpgradeGrid');g.innerHTML='';effects.forEach((effect,i)=>{let owned=!!b.upgrades[i];row(g,'Upgrade '+(i+1),effect,upgradeCost(id,i),owned,()=>{let price=upgradeCost(id,i);if(state.money<price)return;state.money-=price;b.upgrades[i]=true;let n=+effect.match(/[0-9.]+/)[0];if(effect.includes('Power ×'))b.power*=n;else if(effect.includes('Power +'))b.power+=n;else b.interval=Math.max(.5,b.interval*n);persist();save();renderBuildingScreen(id);render()})})}
function renderShop(){let g=$('shop');g.innerHTML='';buildings.forEach(b=>{let r=document.createElement('div');r.className='row';r.innerHTML='<div class="info"><b>'+b.name+'</b><div class="small">'+(state.owned[b.id]?'Owned':b.power+'/cycle every '+b.interval+'s')+'</div></div>';let button=document.createElement('button');button.textContent=state.owned[b.id]?'Owned':fmt(b.cost);button.disabled=!!state.owned[b.id];if(!state.owned[b.id])button.onclick=()=>{if(state.money<b.cost)return;state.money-=b.cost;state.owned[b.id]=true;state.progress[b.id]=0;save();render()};r.append(button);g.append(r)})}
function collect(id){let b=buildings.find(x=>x.id===id),p=state.progress[id]||0;if(!b||!state.owned[id]||state.managers[id]||p<b.interval)return;let q=Math.floor(p/b.interval),gain=q*b.power*(state.event?.multiplier||1);state.money+=gain;state.totalEarned+=gain;state.collectibles+=q;state.progress[id]=p% b.interval;save();render()}
function renderTimers(){let g=$('timers');g.innerHTML='';buildings.forEach(b=>{if(!state.owned[b.id])return;let p=state.progress[b.id]||0,r=document.createElement('div');r.className='panel';r.innerHTML='<b>'+b.name+'</b><div class="small">'+(state.managers[b.id]?'Automated':'Progress '+Math.floor(p)+'/'+b.interval+'s')+'</div><div class="progress"><span style="width:'+Math.min(100,p/b.interval*100)+'%"></span></div>'+(state.managers[b.id]?'':'<button data-id="'+b.id+'" style="width:100%">Collect</button>');g.append(r)});g.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>collect(b.dataset.id))}
function renderGoals(){let q=$('quests'),a=$('achievements');q.innerHTML='';a.innerHTML='';[['clicks','Click 25 times',()=>state.clicks>=25],['money','Earn $1,000 total',()=>state.totalEarned>=1000],['upgrades','Buy 3 upgrades',()=>Object.keys(state.upgrades).length>=3],['investor','Buy an investor',()=>state.investors>=1]].forEach(([id,n,test])=>{let done=state.quests[id]||test();if(done&&!state.quests[id]){state.quests[id]=true;state.money+=250}q.innerHTML+='<div class="small">'+(done?'✅':'⬜')+' '+n+'</div>'});[['first','First click',()=>state.clicks>=1],['building','Own a building',()=>Object.values(state.owned).some(Boolean)],['evolve','Evolve once',()=>state.evolution>1],['prestige','Prestige once',()=>state.prestige>0],['all','Own all buildings',()=>buildings.every(b=>state.owned[b.id])]].forEach(([id,n,test])=>{let done=state.achievements[id]||test();if(done&&!state.achievements[id]){state.achievements[id]=true;state.money+=500}a.innerHTML+='<div class="small">'+(done?'🏆':'🔒')+' '+n+'</div>'})}
function updateEvent(){if(state.event&&Date.now()>=state.eventEndsAt){state.event=null;state.eventEndsAt=0}let active=state.event;$('eventText').textContent=active?active.name+' ×'+active.multiplier+' active':'No event active';$('eventBar').style.width=active?Math.max(0,(state.eventEndsAt-Date.now())/300)+'%':'0%'}function maybeEvent(){if(state.event&&Date.now()<state.eventEndsAt)return;if(Math.random()<.12){let list=[['Golden Lemon',2.5],['Lemon Rush',3],['Fruit Festival',2],['Market Boom',1.8]],p=list[Math.floor(Math.random()*list.length)];state.event={name:p[0],multiplier:p[1]};state.eventEndsAt=Date.now()+30000;msg(p[0]+' started!')}}
function render(){let f=fruit();document.documentElement.style.setProperty('--accent',f[1]);$('title').textContent=f[0]+' Clicker — Money';$('clicker').textContent=f[2];$('money').textContent=fmt(state.money);$('upgradeMoney').textContent=fmt(state.money);$('perClick').textContent='+$'+state.perClick;$('evolution').textContent=f[0];$('prestige').textContent=state.prestige;$('investors').textContent=state.investors;$('combo').textContent='Combo ×'+Math.max(1,state.combo)+' (no multiplier)';$('mps').textContent=Math.floor(buildings.reduce((n,b)=>n+(state.owned[b.id]&&state.managers[b.id]?b.power/(b.interval/speed()):0),0)*(state.event?.multiplier||1))+'/s';$('investorBtn').textContent='Buy Investor ('+fmt(100*2**state.investors)+')';$('evolutionBtn').textContent='Evolve ('+req()+' investors)';$('prestigeBtn').textContent='Prestige ('+fmt(state.prestigeCost)+')';$('muteBtn').textContent=state.muted?'🔇':'🔊';renderShop();renderTimers();renderGoals();renderGlobal();renderManagers();renderBuildingList();updateEvent()}
function baseProduction(){return buildings.reduce((n,b)=>n+(state.owned[b.id]&&state.managers[b.id]?b.power/b.interval:0),0)}function offline(){let seconds=Math.min(14400,(Date.now()-(state.lastSavedAt||Date.now()))/1000),gain=baseProduction()*seconds*state.offlineMultiplier*.4;if(gain>0){state.money+=gain;msg('Offline earnings: '+fmt(gain));save()}}
function tick(){maybeEvent();let now=Date.now(),dt=(now-state.lastTick)/1000;state.lastTick=now;buildings.forEach(b=>{if(!state.owned[b.id])return;let interval=b.interval/speed();state.progress[b.id]=(state.progress[b.id]||0)+dt;if(state.managers[b.id]){let q=Math.floor(state.progress[b.id]/interval);if(q){let gain=q*b.power*(state.event?.multiplier||1);state.money+=gain;state.totalEarned+=gain;state.progress[b.id]%=interval}}});render()}
function wire(){
$('clicker').onclick=e=>{let now=Date.now();if(now-state.lastClick<state.cooldown)return;state.lastClick=now;state.clicks++;state.combo=now-state.lastComboAt<1400?state.combo+1:1;state.lastComboAt=now;let gain=state.perClick*(state.event?.multiplier||1);state.money+=gain;state.totalEarned+=gain;let f=document.createElement('span');f.className='float';f.textContent='+'+fmt(gain);f.style.left=e.clientX+'px';f.style.top=e.clientY+'px';document.body.append(f);setTimeout(()=>f.remove(),1000);save();render()};
$('investorBtn').onclick=()=>{let c=100*2**state.investors;if(state.money<c)return msg('Need '+fmt(c));state.money-=c;state.investors++;resetRun();state.investors++;state.investors--;save();render()};
$('evolutionBtn').onclick=()=>{if(state.investors<req())return msg('Need '+req()+' investors');let next=state.evolution+1;resetRun();state.evolution=next;state.investors=0;save();render()};
$('prestigeBtn').onclick=()=>{if(state.money<state.prestigeCost)return msg('Need '+fmt(state.prestigeCost));let next=state.prestige+1,c=state.prestigeCost;resetRun();state.prestige=next;state.prestigeCost=Math.ceil(c*1.6);state.evolution=1;state.investors=0;save();render()};
$('upgradesBtn').onclick=()=>{$('upgradesScreen').classList.add('open');$('buildingScreen').classList.remove('open');render()};$('closeUpgrades').onclick=()=>$('upgradesScreen').classList.remove('open');$('backToUpgrades').onclick=()=>{$('buildingScreen').classList.remove('open');$('upgradesScreen').classList.add('open');render()};$('saveBtn').onclick=save;$('resetBtn').onclick=()=>{if(confirm('Reset save?')){localStorage.removeItem(KEY);location.reload()}};$('muteBtn').onclick=()=>{state.muted=!state.muted;save();render()}}
load();state.owned??={};state.managers??={};state.progress??={};state.upgrades??={};state.buildingStats??={};state.achievements??={};state.quests??={};state.investors??=0;state.evolution??=1;state.prestige??=0;state.prestigeCost??=1e6;state.offlineMultiplier??=1;state.lastSavedAt??=Date.now();rebuild();buildings.forEach(b=>{state.owned[b.id]??=false;state.progress[b.id]??=0});if(!Object.values(state.owned).some(Boolean))state.owned.stand=true;offline();wire();render();setInterval(tick,1000)
})();
</script>
</body>
</html>
