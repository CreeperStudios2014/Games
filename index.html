<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lemon Clicker — Money Edition</title>
<style>
:root{--accent:#f6b93b;--bg:#081218;--muted:rgba(230,238,246,.9);--surface:rgba(255,255,255,.05)}*{box-sizing:border-box;font-family:Inter,system-ui,sans-serif}body{margin:0;background:var(--bg);color:var(--muted)}#game{max-width:1100px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1{font-size:20px;margin:0}button{border:0;border-radius:8px;padding:8px 10px;background:var(--accent);color:#081218;font-weight:700;cursor:pointer}.controls button{margin-left:8px}.controls #muteBtn{background:var(--surface);color:var(--muted)}main{display:flex;gap:18px;align-items:flex-start}#timers-panel{width:220px}#play-area{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}#sidebar{width:260px}.stat{display:flex;justify-content:space-between;padding:6px 0}.panel{background:var(--surface);padding:14px;border-radius:10px;margin-top:12px}#lemon-card{width:min(100%,480px);height:260px;background:var(--surface);border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative}#lemonImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:12px;opacity:.08}#lemonOverlay{position:relative;text-align:center;z-index:1}#clicker{font-size:40px;padding:18px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--muted)}.small{font-size:12px;color:rgba(230,238,246,.72)}#shop{width:min(100%,480px);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:16px}.shop-row,.upgrade-row,.building-option{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;background:var(--surface);border-radius:8px}.description{flex:1}.disabled{opacity:.55;pointer-events:none}#timersList>div{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08)}.timer-row{display:flex;flex-direction:column;gap:7px}.collectBtn{width:100%}.screen{position:fixed;inset:0;z-index:10;display:none;overflow:auto;background:var(--bg);padding:28px}.screen.open{display:block}.screen-header,.screen-content{max-width:900px;margin-left:auto;margin-right:auto}.screen-header{display:flex;justify-content:space-between;align-items:center}.screen-content{margin-top:18px}.upgrade-grid,.building-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.upgrade-grid .upgrade-row,.building-option{align-items:stretch;flex-direction:column}.upgrade-grid button,.building-option button{width:100%}.money-banner{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;margin-bottom:18px;background:var(--surface);border-radius:10px;font-size:18px}.owned{color:#8ee38e;font-weight:700}@media(max-width:900px){main{flex-wrap:wrap}#timers-panel,#sidebar,#play-area{width:100%}}@media(max-width:600px){#shop{grid-template-columns:1fr}.upgrade-grid,.building-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:380px){.upgrade-grid,.building-grid{grid-template-columns:1fr}}
</style>
</head>
<body><div id="game"><header><h1>Lemon Clicker — Money</h1><div class="controls"><button id="upgradesBtn">Upgrades</button><button id="muteBtn">🔊</button></div></header><main><aside id="timers-panel"><h3>Building Timers</h3><div id="timersList"></div></aside><section id="play-area"><div id="lemon-card"><img id="lemonImg" alt="Lemon"><div id="lemonOverlay"><button id="clicker">🍋</button><div id="perClick">+$1</div><div class="small">Click to earn money.</div></div></div><div id="shop"></div></section><aside id="sidebar"><div class="stat"><span>Money</span><strong id="money">$0</strong></div><div class="stat"><span>Money / sec</span><strong id="mps">0/s</strong></div><div class="stat"><span>Evolution</span><strong>1</strong></div><div class="stat"><span>Prestige</span><strong>0</strong></div><div class="panel small"><button id="saveBtn">Save</button> <button id="resetBtn">Reset</button></div></aside></main><footer>Base click cooldown: <span id="clickCooldownDisplay">250</span> ms</footer></div>
<div id="upgradesScreen" class="screen"><div class="screen-header"><h2>Upgrades</h2><button id="closeUpgrades">Close</button></div><div class="screen-content"><div class="money-banner"><span>Current money</span><strong id="upgradeMoney">$0</strong></div><h3>Global upgrades</h3><div id="globalUpgradeGrid" class="upgrade-grid"></div><h3>Managers</h3><div id="managerGrid" class="upgrade-grid"></div><h3>Building upgrades</h3><div id="buildingGrid" class="building-grid"></div></div></div>
<div id="buildingScreen" class="screen"><div class="screen-header"><h2 id="buildingScreenTitle">Building Upgrades</h2><button id="closeBuildingScreen">Back</button></div><div class="screen-content"><div class="money-banner"><span>Current money</span><strong id="buildingMoney">$0</strong></div><div id="buildingUpgradeGrid" class="upgrade-grid"></div></div></div>
<script>
(()=>{const KEY='lemon_money_v2',MAX=8.8e67,E=id=>document.getElementById(id);const base=[['stand','Lemon Stand',1,5,1,500],['dash','Lemon Dash',4,4,4,600],['depot','Lemon Depot',16,12,16,800],['trading','Lemon Trading',64,10,64,900],['labs','Lemon Labs',256,8,256,1000],['robotics','Lemon Robotics',1024,6,1024,1100],['republic','Lemon Republic',4096,14,4096,1200],['lemonx','LemonX',16384,20,16384,1500]];let prev=2500;const shop=base.map((b,i)=>{let x=[...b];x.splice(2,0,i?Math.min(prev*prev,MAX):2500);prev=x[2];return x});const globals=[['click_power','Upgrade: Click Power',1200000,'Click power +1000'],['click_speed','Upgrade: Click Speed',2000000,'Click cooldown ×0.005']];const upgrades={stand:[['stand_up1','Upgrade 1',50,'Power ×3'],['stand_up2','Upgrade 2',120,'Interval ×0.8'],['stand_up3','Upgrade 3',300,'Power ×4'],['stand_up4','Upgrade 4',1000,'Power ×4'],['stand_up5','Upgrade 5',1000,'Power ×4'],['stand_up6','Upgrade 6',1000,'Interval ×0.01']],dash:[['dash_up1','Upgrade 1',3000,'Power ×3'],['dash_up2','Upgrade 2',7000,'Interval ×0.85']],depot:[['depot_up1','Upgrade 1',20000,'Power +200']],trading:[['trading_up1','Upgrade 1',80000,'Power +1000']],labs:[['labs_up1','Upgrade 1',250000,'Power +5000']],robotics:[['robotics_up1','Upgrade 1',900000,'Power +20000']],republic:[['republic_up1','Upgrade 1',4000000,'Power +100000']],lemonx:[['lemonx_up1','Upgrade 1',8e66,'Power +1000000']]};let s={money:1,perClick:1,cooldown:250,lastClick:0,owned:{},managers:{},investors:0,progress:{},lastCollect:{},upgrades:{},muted:false,lastTick:Date.now()};const fmt=n=>!isFinite(n)?'$0':n<1e6?'$'+Math.floor(n).toLocaleString():'$'+n.toExponential(2),mult=()=>Math.pow(1.05,s.investors||0),save=()=>localStorage.setItem(KEY,JSON.stringify(s));function load(){try{Object.assign(s,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}}function open(id){E(id).classList.add('open')}function close(id){E(id).classList.remove('open')}
function row(c,name,desc,cost,id,action,kind='upgrade'){let r=document.createElement('div');r.className='upgrade-row';let owned=kind==='manager'?s.managers[id]:s.upgrades[id];r.innerHTML='<div class="description"><b>'+name+'</b><div class="small">'+desc+'</div>'+(owned?'<div class="owned">Owned</div>':'')+'</div>';let b=document.createElement('button');b.textContent=owned?'Owned':fmt(cost);if(owned)b.className='disabled';else b.onclick=()=>{if(s.money>=cost){s.money-=cost;action();save();render()}};r.append(b);c.append(r)}
function renderBuilding(id){let b=shop.find(x=>x[0]===id);E('buildingScreenTitle').textContent=b[1]+' Upgrades';E('buildingMoney').textContent=fmt(s.money);let c=E('buildingUpgradeGrid');c.innerHTML='';(upgrades[id]||[]).forEach(u=>row(c,u[1],u[3],u[2],u[0],()=>{if(u[3].includes('Power ×'))b[3]*=+u[3].match(/\d+/)[0];else if(u[3].includes('Power +'))b[3]+=+u[3].match(/\d+/)[0];else b[4]*=+u[3].match(/\d+(?:\.\d+)?/)[0]}))}
function renderUpgrades(){E('upgradeMoney').textContent=fmt(s.money);let g=E('globalUpgradeGrid');g.innerHTML='';globals.forEach(u=>row(g,u[1],u[3],u[2],u[0],()=>u[0]==='click_power'?s.perClick+=1000:s.cooldown=Math.max(30,Math.floor(s.cooldown*.005))));let m=E('managerGrid');m.innerHTML='';shop.forEach(b=>row(m,b[1]+' Manager','Automates '+b[1],b[2],b[0],()=>s.managers[b[0]]=1,'manager'));let g2=E('buildingGrid');g2.innerHTML='';shop.forEach(b=>{let r=document.createElement('div');r.className='building-option';r.innerHTML='<b>'+b[1]+'</b><div class="small">View '+(upgrades[b[0]]||[]).length+' upgrades</div><button>Open</button>';r.onclick=()=>{close('upgradesScreen');renderBuilding(b[0]);open('buildingScreen')};g2.append(r)})}
function renderShop(){let c=E('shop');c.innerHTML='';shop.forEach(b=>{let r=document.createElement('div');r.className='shop-row';r.innerHTML='<div><b>'+b[1]+'</b><div class="small">'+(s.owned[b[0]]?'Owned':'One-time purchase')+' · '+b[3]+'/cycle every '+b[4]+'s</div></div>';let q=document.createElement('button');q.textContent=s.owned[b[0]]?'Owned':fmt(b[2]);if(s.owned[b[0]])q.className='disabled';else q.onclick=()=>{if(s.money>=b[2]){s.money-=b[2];s.owned[b[0]]=true;s.progress[b[0]]=0;save();render()}};r.append(q);c.append(r)})}
function collect(id){let b=shop.find(x=>x[0]===id);if(!b||!s.owned[id]||s.managers[id])return;let now=Date.now(),p=s.progress[id]||0;if(now-(s.lastCollect[id]||0)<b[6])return;let q=Math.floor(p/b[4]);s.money+=(q?q*b[3]:b[5])*mult();s.progress[id]=q?p%b[4]:0;s.lastCollect[id]=now;save();render()}
function render(){E('money').textContent=fmt(s.money);E('mps').textContent=Math.floor(shop.reduce((n,b)=>n+(s.owned[b[0]]&&s.managers[b[0]]?b[3]/b[4]:0),0)*mult())+'/s';E('perClick').textContent='+$'+s.perClick;E('clickCooldownDisplay').textContent=s.cooldown;E('muteBtn').textContent=s.muted?'🔇':'🔊';renderShop();renderUpgrades();let t=E('timersList');t.innerHTML='';shop.forEach(b=>{if(!s.owned[b[0]])return;let p=s.progress[b[0]]||0;t.innerHTML+='<div class="timer-row"><b>'+b[1]+'</b><span class="small">'+(s.managers[b[0]]?'Automated · '+Math.max(0,b[4]-p).toFixed(1)+'s remaining':'Progress: '+Math.floor(p)+'/'+b[4]+'s')+'</span>'+(s.managers[b[0]]?'':'<button class="collectBtn" data-id="'+b[0]+'">Collect</button>')+'</div>'});if(!t.innerHTML)t.textContent='Own a building to see its timer here.';t.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>collect(x.dataset.id))}
function tick(){let now=Date.now(),dt=(now-s.lastTick)/1000;s.lastTick=now;shop.forEach(b=>{if(!s.owned[b[0]])return;s.progress[b[0]]=(s.progress[b[0]]||0)+dt;if(s.managers[b[0]]){let q=Math.floor(s.progress[b[0]]/b[4]);if(q){s.money+=q*b[3]*mult();s.progress[b[0]]%=b[4]}}});render()}load();shop.forEach(b=>{s.owned[b[0]]??=false;s.progress[b[0]]??=0;s.lastCollect[b[0]]??=0});if(!Object.values(s.owned).some(Boolean))s.owned.stand=true;E('clicker').onclick=()=>{let n=Date.now();if(n-s.lastClick>=s.cooldown){s.lastClick=n;s.money+=s.perClick*mult();render()}};E('upgradesBtn').onclick=()=>{renderUpgrades();open('upgradesScreen')};E('closeUpgrades').onclick=()=>close('upgradesScreen');E('closeBuildingScreen').onclick=()=>{close('buildingScreen');open('upgradesScreen')};E('saveBtn').onclick=save;E('resetBtn').onclick=()=>{if(confirm('Reset save?')){localStorage.removeItem(KEY);location.reload()}};E('muteBtn').onclick=()=>{s.muted=!s.muted;save();render()};E('lemonImg').src='https://source.unsplash.com/1600x900/?lemon';render();setInterval(tick,1000)})();
</script></body></html>
